/* uključivanje držanjem: dugme se puni 1,5 s */

.alp .b .btn.hold span{position:relative;z-index:1}
.alp .b .btn.hold::before{content:"";position:absolute;inset:0;width:0;background:color-mix(in srgb,var(--crit) 35%,transparent)}
.alp .b .btn.hold.arm::before{background:rgba(255,255,255,.35)}
.alp .b .btn.hold.holding::before{width:100%;transition:width 1.5s linear}
.alp .b .btn.hold.sent{animation:alsent .5s ease-out}
@keyframes alsent{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
/* izlazno/ulazno vreme: pokretna traka */
.alp{position:relative;overflow:hidden}
.aldelay{position:absolute;left:0;right:0;bottom:0;height:4px;background:color-mix(in srgb,var(--warn) 25%,transparent)}
.aldelay i{display:block;height:100%;width:40%;background:var(--warn);animation:aldelay 1.2s ease-in-out infinite}
@keyframes aldelay{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* prečice PGM1/PGM2: aktiviraj na 5 s */
.alquick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.qpg{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font:inherit;color:inherit;cursor:pointer;text-align:left}
.qpg .qic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);flex:none;position:relative;z-index:1}
.qpg .qtx{display:flex;flex-direction:column;position:relative;z-index:1}.qpg b{font-size:14px}.qpg small{font-size:12px;color:var(--muted);font-weight:700}
.qpg .qbar{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.qpg.run{border-color:var(--accent)}.qpg.run small{color:var(--accent)}
.qpg.run .qbar{width:100%;transition:width 5s linear}
.qpg.run .qic{background:var(--accent);color:#fff}
.qpg.dis{opacity:.6;cursor:not-allowed}.qpg.dis small{color:var(--warn)}
.alg.dis span:not(.b){white-space:normal}.alg small{display:block;font-size:11.5px;font-weight:600;color:var(--warn)}
body[data-view="cctv"] .grid{display:none!important}
body[data-view="alarm"] .grid{grid-template-columns:minmax(0,1fr)!important}
body:not([data-view="media"]) .mbar{display:none!important}
/* Admin stranica: samo podešavanja (izvori i konzole, tasteri daljinskog, kartice sa klasom adm) */
body[data-view="admin"] #qCard,body[data-view="admin"] #sendCard,body[data-view="admin"] #tempCard{display:none!important}
body:not([data-view="media"]) .top-in .rtop{display:none!important}   /* prečica „Daljinski“ samo na Multimediji */
#sysAdmCard .sset{border-top:0;padding-top:0}
/* redosled na Admin stranici kao u meniju: izvori, tasteri, slike, obaveštenja, BT, cast, alarm, mreža, sistem, pristup */
#alCfgCard{order:10}#netCard{order:11}#sysAdmCard{order:12}#accCard{order:13}
main.wrap section.card,#alParts,#alZones,#alCfg{scroll-margin-top:130px}
.navflash{animation:navflash 1.2s ease-out}
@keyframes navflash{0%,30%{box-shadow:0 0 0 3px var(--accent),0 0 24px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.cctv .soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:30px 10px;color:var(--muted)}
.cctv .soon svg.i{width:44px;height:44px;color:var(--faint)}
.cctv .soon b{color:var(--text);font-size:16px}
.cctv .soon p{margin:0;font-size:13px}
.sidetog{display:none;margin-top:auto;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line);color:var(--muted);font:700 12.5px/1 var(--f-body);cursor:pointer;width:100%}
.sidetog:hover{color:var(--text);border-color:var(--faint)}
.sidetog svg.i{width:16px;height:16px}
/* zaglavlje svuda: ikonica + naziv stranice (logo Teco.Pi je u meniju / fioci) */
header.top .logo{display:none}
@media (max-width:480px){.top-in .rtop{padding:0 5px}.top-in .rtop .al{display:none}.top-in .rtop .lk{background:transparent}}
@media (max-width:999px){.ptitle{display:flex!important;font-size:17px;gap:8px;min-width:0}.ptitle .pic{width:32px;height:32px;border-radius:10px}.ptitle #ptTxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.ptitle{display:none;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.ptitle .pic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.ptitle .pic svg.i{width:20px;height:20px}
@media (min-width:1000px){
  /* meni levo; uska kolona (600 px) prati meni, ne pluta na sredini; logo je u meniju, a gore je naziv dela */
  /* meni + stranica kao jedna celina na sredini (--sw + 28 + 600 px); meni je zaobljena kartica.
     Skupljen meni (body.side-mini) je uska traka samo sa ikonicama. */
  body{--sw:236px;--shell:calc(var(--sw) + 628px)}
  body.side-mini{--sw:72px}
  .side{width:var(--sw);left:max(16px,calc((100% - var(--shell)) / 2));top:16px;bottom:16px;border:1px solid var(--line);border-radius:22px;
    box-shadow:0 10px 30px rgba(15,23,42,.08);padding-top:18px;transition:width .2s ease,left .2s ease}
  header.top .logo{display:none}
  .ptitle{display:flex}
  .wrap,.top-in{margin-left:max(calc(var(--sw) + 28px),calc((100% - var(--shell)) / 2 + var(--sw) + 28px))!important;margin-right:auto!important;
    transition:margin-left .2s ease}
  .sidetog{display:flex}
  body.side-mini .side{padding-inline:10px;align-items:center}
  body.side-mini .side-logo{padding:4px 0 8px}
  body.side-mini .side-logo .slt,body.side-mini .tsec span,body.side-mini .tsec small,body.side-mini .sidetog span,body.side-mini .titems{display:none!important}
  body.side-mini .tsec{width:48px;height:44px;justify-content:center;padding:0;position:relative}
  body.side-mini .tsec .tdot{position:absolute;top:7px;right:7px;margin:0}
  body.side-mini .sidetog{width:48px;justify-content:center;padding:0}
  /* zaglavlje: puna pozadina (ništa se ne vidi iznad ni kroz njega pri skrolu), zaobljen panel iznad kolone */
  header.top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;padding-top:16px;padding-bottom:10px}
  header.top::after{display:none}
  header.top .top-in{padding:10px 12px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line)}
  .mbar{display:none!important}   /* na računaru bez mini plejera */
  body.mb-on{padding-bottom:0}
  body.mb-on:not(.admin) .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  body .admbar,body .toast{left:max(calc(var(--sw) + 344px),calc((100% - var(--shell)) / 2 + var(--sw) + 328px))}
}
@media (max-width:999px){
  .navbtn{display:grid}
  .side{transform:translateX(-105%);transition:transform .22s cubic-bezier(.2,.9,.25,1);box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.nav-open .side{transform:none}
  .top-in .rtop{margin-left:auto}
}
.alcfg .chk{flex-direction:row!important;align-items:center;gap:8px;font-size:13.5px;color:var(--text)}
.alcfg .chk input{width:18px;height:18px;accent-color:var(--accent)}
.alcfg{border-top:1px solid var(--line);padding-top:10px}
.alcfg summary{cursor:pointer;font-weight:700;font-size:13.5px}
.alcfg[open]{display:flex;flex-direction:column;gap:10px}
/* Sistem: redovi sa stanjem */
.strows{display:flex;flex-direction:column;gap:6px}
.strow{--c:var(--faint);display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;column-gap:10px;row-gap:3px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--c)}
.strow[data-lvl="ok"]{--c:var(--ok)}.strow[data-lvl="warn"]{--c:var(--warn)}.strow[data-lvl="crit"]{--c:var(--crit)}
.strow .sic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.strow .sic svg.i{width:18px;height:18px}
.strow .sic{grid-row:1/3;align-self:start}
.strow .stx{display:contents}
.strow .stx b{font-size:13.5px;grid-column:2;grid-row:1;min-width:0}
.strow .stx small{font-size:12px;color:var(--muted);line-height:1.35;grid-column:2/-1;grid-row:2}
.strow .sval{grid-column:3;grid-row:1;font:700 14px/1.2 var(--f-mono);text-align:right;white-space:nowrap}
.strow .sval small{font-size:11.5px;color:var(--muted);font-weight:500}
.strow:not([id]) .sic,#rowLoad:not([data-lvl]) .sic{--c:var(--muted)}
.strow .spark{grid-column:1/-1;grid-row:3;width:100%;height:26px;margin-top:4px}
.sset{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.sset .bootrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;font-weight:700}
/* I/O: releji i uređaji na klik */
.ioexp{border-radius:12px;background:var(--surface-2)}
.ioexp>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
.ioexp>summary::-webkit-details-marker{display:none}
.ioexp>summary .iohead{margin:0}
.ioexp>summary small{font-size:12px}
.ioexp>summary .chev{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.ioexp[open]>summary .chev{transform:rotate(180deg)}
.ioexp>.relays,.ioexp>.iolist{padding:0 10px 10px}
.nstat{margin-left:6px;font-size:12px;font-weight:600;color:var(--muted)}
.nstat i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px;font-style:normal}
.npre{display:flex;flex-wrap:wrap;gap:6px}
.npre button{height:30px;padding:0 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font:700 12px/1 var(--f-body);color:var(--muted);cursor:pointer}
.npre button:hover{border-color:var(--accent);color:var(--text)}
/* zvono i interfon */
#evCard{order:6}
.evlist{display:flex;flex-direction:column;gap:12px}
.ev{display:block;padding:12px;border-radius:14px;background:var(--surface-2)}
.ev.off{opacity:.6}
.ev img{width:100%;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:#0b1018}
.ev-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev-top{display:flex;gap:8px;align-items:center}
.ev-top .field{height:38px;font-weight:700}
.ev .swb{flex:none;background:none;border:0;padding:0;cursor:pointer}
.ev .swb .sw{display:block}
.ev-top .field{flex:1;min-width:0;width:auto}
.ev-top .ev-n{flex:1;min-width:0;font-size:15px;display:flex;align-items:center;gap:8px}
.ev-top .ev-n::after{content:'ALARM';font:800 10px/1 var(--f-body);letter-spacing:.08em;padding:4px 6px;border-radius:6px;color:#ef4444;background:color-mix(in srgb,#ef4444 14%,transparent)}
.ev .swb[aria-checked="true"] .sw{background:var(--accent)}
.ev .swb[aria-checked="true"] .sw::after{transform:translateX(18px)}
.ev .row{justify-content:flex-start;gap:8px;font-size:13px}
.ev .evsec{width:72px;height:34px;text-align:center;font-weight:700}
.ev .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.ev .chk input{accent-color:var(--accent);width:16px;height:16px}
.ev-snd{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.ev-snd b{color:var(--text)}
.ev-snd code{font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}
.ev-btns{display:flex;gap:6px;flex-wrap:wrap}
.ev-btns .btn{height:34px;padding:0 12px;font-size:12.5px}
.ev-btns label.btn{position:relative;overflow:hidden}
.ev-btns label.btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:420px){.ev{grid-template-columns:minmax(0,1fr)}}
.evalert{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:16px;background:var(--text);color:var(--surface);box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:evin .3s ease-out}
.evalert img{width:72px;aspect-ratio:16/9;border-radius:8px;object-fit:cover}
.evalert b{display:block;font-size:15px}
.evalert span{font-size:12.5px;opacity:.7}
@keyframes evin{from{transform:translate(-50%,-20px);opacity:0}}
#rebootBtn{margin-top:14px;width:100%;height:44px;justify-content:center;color:#dc2626;background:color-mix(in srgb,#dc2626 8%,transparent);border:1.5px solid color-mix(in srgb,#dc2626 45%,transparent);font-weight:700}
#rebootBtn:hover{background:color-mix(in srgb,#dc2626 14%,transparent)}
#castCard{order:8}
#accCard{order:9} #sendCard{order:20}
.acc-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:var(--surface-2);text-align:left}
.acc-row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-row .t b{font-size:14.5px}
.acc-row .t span{font-size:12.5px;color:var(--muted)}
.acc-row[aria-checked="true"] .sw{background:var(--accent)}

.outs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.outs .ol{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px;margin-right:2px}
.och{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--text)}
.och svg.i{width:15px;height:15px;color:var(--muted)}
.och[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.och[aria-pressed="true"] svg.i{color:var(--accent)}
#btCard{order:7} #netCard{order:8}
.btlist{display:flex;flex-direction:column;gap:6px}
.btd{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--surface-2)}

.btd .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btd .t span{font-size:12px;color:var(--muted)}
.btd .bb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.btd .btn{height:34px;padding:0 12px;font-size:12.5px}
.netinfo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.netinfo dt{color:var(--muted)}
.netinfo dd{margin:0;font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.netinfo a{color:var(--accent)}
/* prozor sa temperaturama */
.tcard{padding:14px 18px}
.tgrid{display:flex;gap:14px}
.tbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tbox:not([hidden]) ~ .tbox:not([hidden]){border-left:1px solid var(--line);padding-left:14px}
.tbox .k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.tbox .k svg.i{width:15px;height:15px}
.tbox .v{display:flex;align-items:baseline;gap:4px}
.tbox .v b{font-family:var(--f-display);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.tbox .v small{font-size:16px;color:var(--muted);font-weight:600}
.tbox .v .hum{margin-left:6px;font-size:13px;white-space:nowrap}
.tbox .spark{width:100%;height:26px;display:block;margin-top:4px}

.top-in .chips::-webkit-scrollbar{display:none}

.sbar .admin-sw .lk svg.i{width:13px;height:13px}

.sbar .schip:hover{border:0}
@media (max-width:420px){
  .top-in .sbar{flex:1 1 auto;min-width:0}
  .sbar .schip{flex:1 1 auto;padding:0 4px 0 8px;gap:3px;font-size:12px}

.top-in .chip .lbl{display:inline!important}
.schip{gap:5px;padding:0 12px;font-size:12.5px}

.schip b{font-size:12.5px;margin-right:1px}

.schip .sep{width:1px;height:14px;background:var(--line);margin:0 4px}
.schip .sdot{width:9px;height:9px}
.schip .pw-ic{width:15px;height:15px;margin-right:-1px}

.admin-sw:hover{border-color:var(--accent);color:var(--text)}
.admin-sw[aria-checked="true"]{background:linear-gradient(180deg,var(--gel-top),var(--gel-mid) 55%,var(--gel-bot));border:1.5px solid var(--gel-edge);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent);text-shadow:0 1px 1px rgba(0,0,0,.25)}

.rk.num{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px}

      const bmn = $('#stMine'); bmn.innerHTML = ''; mine.forEach(x => bmn.appendChild(item(x)));
      $('#stMineGrp').hidden = !mine.length && !adm;
      if (!mine.length) bmn.innerHTML = '<span class="muted" style="font-size:13px">Dodaj svoj link ispod.</span>';
      const favs = sm.fav.map(u => allSt.find(x => x.u === u && x.c !== 'my')).filter(Boolean);
      const bf = $('#stFav'); bf.innerHTML = '';
      favs.forEach(x => bf.appendChild(item(x)));
      if (!favs.length) bf.innerHTML = '<span class="muted" style="font-size:13px">Otvori „Sve stanice” i zvezdicom ☆ označi stanice koje hoćeš ovde.</span>';
      const cats = [...new Set(allSt.map(x => x.c))];
      $('#stCats').innerHTML = ['', ...cats].map(k => `<button type="button" data-c="${k}" aria-pressed="${k === stCat}">${k ? STCAT[k] || k : 'Sve'}</button>`).join('');
      $$('#stCats button').forEach(b => b.onclick = () => { stCat = b.dataset.c; render(); });
      const bl = $('#stList'); bl.innerHTML = '';
      allSt.filter(x => !stCat || x.c === stCat).forEach(x => bl.appendChild(item(x)));
      $('#stCount').textContent = allSt.length;
    }

    /* mini plejer */
    { const [src, line] = nowLine(), av = ['av2', 'av3', 'av4'].includes(s.source);
      $('#mbSrc').textContent = src; mbTitle(line);
      const playing = s.source === 'av1' ? s.mode === 'yt' && !s.paused : s.source === 'tv' ? s.tv.on && !s.paused : (s.source === 'st' ? s.stream.on : s.fm.on) && !s.mute;
      $('#mbIco').setAttribute('href', playing ? '#i-pause' : '#i-play');
      $('#mbar .mb-ctl').hidden = av;
      mbarShow(); }

    /* sistem */
    const y = s.sys || {};
    $('#chCpu').textContent = y.cpu != null ? Math.round(y.cpu) + '°C' : '—';
    $('#chLoad').textContent = y.load != null ? y.load + '%' : '—';
    $('#chRam').textContent = y.ram != null ? y.ram + '%' : '—';
    $('#chLoad').style.color = y.load >= 85 ? 'var(--crit)' : y.load >= 60 ? 'var(--warn)' : '';
    $('#chRam').style.color = y.ram >= 85 ? 'var(--crit)' : y.ram >= 70 ? 'var(--warn)' : '';
    $('#stCpu').innerHTML = y.cpu != null ? y.cpu.toFixed(1) + '<small> °C</small>' : '—';
    /* prozor sa temperaturama: samo senzori koji se očitavaju */
    $('#tIn').hidden = y.room == null; $('#tOut').hidden = y.out == null;
    $('#tempCard').hidden = y.room == null && y.out == null;
    if (y.room != null) $('#tInV').textContent = y.room.toFixed(1);
    $('#tHum').hidden = y.hum == null; if (y.hum != null) $('#tHum').textContent = '· ' + y.hum + '% vlažnost';
    if (y.out != null) $('#tOutV').textContent = y.out.toFixed(1);
    const up = y.uptime || 0; $('#stUp').innerHTML = up >= 86400 ? Math.floor(up / 86400) + '<small> d</small> ' + Math.floor(up % 86400 / 3600) + '<small> h</small>' : Math.floor(up / 3600) + '<small> h</small> ' + Math.floor(up % 3600 / 60) + '<small> min</small>';
    $('#stDisk').innerHTML = (y.disk_free ?? '—') + '<small> GB</small> · ' + (y.mem_free ?? '—') + '<small> MB</small>';
    const pw = y.uv_now ? ['Pad napona!', 'var(--crit)'] : y.uv_seen ? ['Napon je padao', 'var(--warn)'] : ['Napajanje stabilno', 'var(--ok)'];
    $('#chPowDot').style.background = pw[1]; $('#chPowIc').style.color = pw[1]; $('#chPowDot').setAttribute('aria-label', 'Napajanje: ' + pw[0]); $('#chPowDot').title = pw[0];
    const nt = y.inet === 'ok' ? ['Internet radi' + (y.inet_ms != null ? ' (' + y.inet_ms + ' ms)' : ''), 'var(--ok)'] : y.inet === 'dns' ? ['Internet: DNS ne radi', 'var(--warn)'] : y.inet === 'off' ? ['Nema interneta', 'var(--crit)'] : ['Proveravam internet…', 'var(--faint)'];
    $('#chNetDot').style.background = nt[1]; $('#chNetIc').style.color = nt[1]; $('#chNetDot').setAttribute('aria-label', nt[0]); $('#chNetDot').title = nt[0]; $('#chNetIc').parentNode.title = 'Sistem · ' + nt[0];
    /* prozor Sistem: svaki red ima stanje (boja), vrednost i kratko objašnjenje */
    const row = (id, lvl, val, hint) => { const r = $('#' + id); r.dataset.lvl = lvl; if (val != null) r.querySelector('.sval').innerHTML = val; if (hint != null) r.querySelector('small').textContent = hint; return lvl; };
    const lv = [];
    lv.push(row('rowPow', y.uv_now ? 'crit' : y.uv_seen ? 'warn' : 'ok', y.uv_now ? 'Pad napona' : y.uv_seen ? 'Padao je' : 'Stabilno',
      y.uv_now ? 'Napajanje je trenutno preslabo. Koristi jači adapter (5 V, bar 3 A) i kraći kabl.'
        : y.uv_seen ? 'Od uključivanja je bar jednom bilo premalo napona (npr. kad krene video). Ako se ponavlja, uzmi jači adapter.'
        : 'Napon je u redu od uključivanja.'));
    lv.push(row('rowNet', y.inet === 'ok' ? 'ok' : y.inet === 'dns' ? 'warn' : y.inet === 'off' ? 'crit' : 'idle',
      y.inet === 'ok' ? 'Radi' + (y.inet_ms != null ? '<small> · ' + y.inet_ms + ' ms</small>' : '') : y.inet === 'dns' ? 'DNS ne radi' : y.inet === 'off' ? 'Nema' : 'Proveravam…',
      y.inet === 'ok' ? 'Teco.Pi izlazi na internet (provera na 30 s). Odziv ispod 50 ms je odličan.'
        : y.inet === 'dns' ? 'Veza postoji, ali se imena sajtova ne pronalaze: YouTube, radio i TV neće raditi. Proveri DNS u Mreži (npr. 1.1.1.1).'
        : y.inet === 'off' ? 'Lokalna mreža radi, ali nema izlaza na internet. Proveri ruter ili kabl ka njemu.'
        : 'Prva provera je u toku.'));
    const ct = y.cpu;
    lv.push(row('rowCpu', ct == null ? 'idle' : ct >= 80 ? 'crit' : ct >= 70 ? 'warn' : 'ok', null,
      ct == null ? 'Nema očitavanja.' : ct >= 80 ? 'Previše toplo: procesor usporava. Obezbedi hlađenje (ventilator, otvori kutiju).'
        : ct >= 70 ? 'Toplo, ali radi normalno. Iznad 80 °C procesor usporava.' : 'Normalno (do 70 °C je sasvim u redu).'));
    lv.push(row('rowLoad', y.load >= 85 || y.ram >= 85 ? 'warn' : 'ok',
      'CPU ' + (y.load ?? '—') + '%<small> · RAM ' + (y.ram ?? '—') + '%</small>',
      y.load >= 85 ? 'Procesor je pun: video može da secka.' : y.ram >= 85 ? 'Radne memorije je malo.' : 'Procesor i radna memorija'));
    const worst = lv.includes('crit') ? 'crit' : lv.includes('warn') ? 'warn' : 'ok';
    const pill = $('#sysPill'), pc = worst === 'crit' ? 'var(--crit)' : worst === 'warn' ? 'var(--warn)' : 'var(--ok)';
    $('#sysPillTxt').textContent = worst === 'crit' ? 'Potrebna pažnja' : worst === 'warn' ? 'Upozorenje' : 'Sve radi';
    $('#sysPillIc').setAttribute('href', worst === 'ok' ? '#i-check' : '#i-alert');
    pill.style.color = pc; pill.style.background = `color-mix(in srgb, ${pc} 14%, transparent)`;
    alRender(s.alarm);
    /* tema (bira se u adminu, važi za sve uređaje) */
    if (changed('theme', s.theme)) {
      const th = s.theme || 'auto';
      if (th === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = th;
      try { localStorage.setItem('teco-theme', th); } catch (e) {}
      $$('#themeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === th));
    }
    if (changed('spark', [y.cpu_hist, y.room_hist, y.out_hist])) { spark('#spCpu', y.cpu_hist, css('--muted') || '#5a6a7e'); spark('#spRoom', y.room_hist, css('--accent') || '#0d9488'); spark('#spOut', y.out_hist, css('--av2') || '#d97706'); }

    /* događaj na ekranu: obaveštenje i na stranici */
    const en = s.ev_now;
    $('#evAlert').hidden = !en;
    if (en && changed('evNow', en.id + en.at)) { $('#evName').textContent = en.n; $('#evImg').src = '/events/' + en.id + '/image.png?v=' + encodeURIComponent(en.n); }

    /* zvono i interfon (admin) */
    if (changed('events', s.events) && !$('#evList').contains(document.activeElement)) {
      const box = $('#evList'); box.innerHTML = '';
      (s.events || []).forEach(ev => {
        const d = document.createElement('div'); d.className = 'ev' + (ev.on ? '' : ' off');
        const snd = ev.alarm ? '<div class="ev-snd"><span>Ugrađen zvuk alarma (ponavlja se dok je na ekranu)</span><div class="ev-btns"><button class="btn gel" data-a="test"><span>Probaj</span></button></div></div>'
          : `<div class="ev-snd"><span>${ev.sound ? 'Zvuk: <b>' + esc(ev.sound) + '</b>' : 'Nema zvuka. Otpremi svoj (mp3, wav, ogg).'}</span>
              <div class="ev-btns"><label class="btn"><span>${ev.sound ? 'Zameni zvuk' : 'Otpremi zvuk'}</span><input type="file" accept="audio/*"></label>${ev.sound ? '<button class="btn ghost" data-a="del">Obriši zvuk</button>' : ''}<button class="btn gel" data-a="test"><span>Probaj</span></button></div></div>`;
        d.innerHTML = `<div class="ev-body">
            <div class="ev-top">${ev.alarm ? '<b class="ev-n">' + esc(ev.n) + '</b>' : '<input class="field" maxlength="30" aria-label="Naziv">'}<button class="swb" role="switch" aria-checked="${ev.on}" aria-label="Uključeno"><span class="sw"></span></button></div>
            <div class="row"><span class="muted">Na ekranu</span><input class="field evsec" type="number" inputmode="numeric" min="1" max="120" value="${ev.sec}" aria-label="Sekundi"><span class="muted">s</span></div>
            <label class="chk"><input type="checkbox" ${ev.pause ? 'checked' : ''}>Pauziraj video</label>
            ${snd}
          </div>`;
        const nm = d.querySelector('.ev-top .field');
        if (nm) { nm.value = ev.n; nm.addEventListener('change', () => act('ev_set', { id: ev.id, n: nm.value })); }
        d.querySelector('.swb').onclick = () => act('ev_set', { id: ev.id, on: !ev.on });
        const sec = d.querySelector('.evsec'); sec.addEventListener('change', () => { const v = Math.round(+sec.value); if (v >= 1 && v <= 120) act('ev_set', { id: ev.id, sec: v }); else { sec.value = ev.sec; toast('Od 1 do 120 sekundi.'); } });
        d.querySelector('.chk input').onchange = e => act('ev_set', { id: ev.id, pause: e.target.checked });
        d.querySelector('[data-a="test"]').onclick = () => act('ev_test', { id: ev.id });
        const del = d.querySelector('[data-a="del"]'); if (del) del.onclick = () => act('ev_sound_del', { id: ev.id });
        const fin = d.querySelector('input[type=file]'); if (fin) fin.onchange = async e => {
          const f = e.target.files[0]; if (!f) return; const fd = new FormData(); fd.append('file', f, f.name);
          try { const r = await fetch('/api/event-sound?id=' + ev.id, { method: 'POST', headers: { 'X-Teco-Token': tok || '' }, body: fd }).then(x => x.json()); toast(r.err || r.ok); }
          catch (err) { toast('Otpremanje nije uspelo.'); }
        };
        box.appendChild(d);
      });
    }

    /* izlaz zvuka */
    const outs = s.audio || [];
    $('#outs').hidden = !outs.length;
    if (changed('outs', outs)) {
      const box = $('#outs'); box.innerHTML = '<span class="ol">Zvuk</span>';
      outs.forEach(o => {
        const b = document.createElement('button'); b.className = 'och'; b.setAttribute('aria-pressed', o.def);
        b.innerHTML = `<svg class="i"><use href="#${o.bt ? 'i-headph' : 'i-vol'}"/></svg><span>${esc(o.n)}</span>`;
        b.onclick = () => { if (!o.def) act('audio_out', { id: o.id }).then(r => { if (!r.err) toast('Zvuk: ' + o.n); }); };
        box.appendChild(b);
      });
    }

    /* Bluetooth (admin) */
    const bt = s.bt || {};
    $('#btScan').disabled = !!bt.scan; $('#btScanTxt').textContent = bt.scan ? 'Tražim...' : 'Traži uređaje';
    if (changed('bt', [bt.devs, bt.power])) {
      const box = $('#btList'); box.innerHTML = '';
      (bt.devs || []).forEach(d => {
        const r = document.createElement('div'); r.className = 'btd' + (d.conn ? ' conn' : '');
        const st = d.conn ? 'Povezano' : d.paired ? 'Upareno, nije povezano' : 'Nije upareno';
        const btns = d.conn ? [['bt_disconnect', 'Prekini']] : d.paired ? [['bt_connect', 'Poveži'], ['bt_remove', 'Zaboravi']] : [['bt_pair', 'Upari']];
        r.innerHTML = `<span class="ic"><svg class="i"><use href="#${d.audio ? 'i-headph' : 'i-signal'}"/></svg></span><div class="t"><b>${esc(d.n)}</b><span>${st}</span></div><div class="bb"></div>`;
        btns.forEach(([c, lbl]) => {
          const b = document.createElement('button'); b.className = 'btn' + (c === 'bt_pair' || c === 'bt_connect' ? ' gel' : ''); b.innerHTML = `<span>${lbl}</span>`;
          b.onclick = async () => { b.disabled = true; b.firstChild.textContent = lbl + '...'; await act(c, { mac: d.mac }); b.disabled = false; b.firstChild.textContent = lbl; };
          r.querySelector('.bb').appendChild(b);
        });
        box.appendChild(r);
      });
      if (!(bt.devs || []).length) box.innerHTML = '<p class="muted" style="font-size:13px;margin:0">Još nema pronađenih uređaja.</p>';
    }

    /* mreža (admin) */
    const n = s.net || {};
    if (changed('net', n)) {
      const rows = [['Adresa', n.host ? `<a href="http://${esc(n.host)}.local/">http://${esc(n.host)}.local</a>` : '—']];
      (n.ifs || []).filter(i => i.up || i.ip.length).forEach(i => {
        rows.push([i.n === 'eth0' ? 'Kabl' : i.n === 'wlan0' ? 'Wi-Fi' : i.n, esc((i.ip.join(', ') || 'bez adrese').replace(/\/\d+/g, ''))]);
      });
      rows.push(['Gateway', esc(n.gw || '—')]);
      if (n.ssid) rows.push(['Wi-Fi mreža', esc(n.ssid) + ' · signal ' + esc(n.signal) + '%']);
      $('#netInfo').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
      const e = n.eth;
      if (e && !$('.netcfg').contains(document.activeElement)) {
        netMode = e.mode;
        const [ipa, pfx] = (e.ip || (n.ifs || []).find(i => i.n === 'eth0')?.ip?.[0] || '').split('/');
        $('#netIp').value = ipa || '';
        if (pfx) { const ms = $('#netMask'); if (![...ms.options].some(o => o.value === pfx)) ms.add(new Option('/' + pfx, pfx)); ms.value = pfx; }
        $('#netGw').value = e.gw || n.gw || '';
        showNetMode();
      }
      const d = n.dns || {}, dot = c => `<i style="background:${c}"></i>`;
      $('#dnsNow').innerHTML = d.active?.length ? dot(s.sys?.inet === 'dns' ? 'var(--crit)' : 'var(--ok)') + 'koristi ' + esc(d.active.join(', ')) : '';
      if (!$('#dnsCfg').contains(document.activeElement)) { dnsMode = d.mode || 'auto'; $('#dnsSrv').value = (d.servers || []).join(' '); showDnsMode(); }
      const t = n.ntp || {};
      $('#ntpNow').innerHTML = t.sync ? dot('var(--ok)') + 'sinhronizovan' + (t.server ? ' · ' + esc(t.server) : '') : dot('var(--warn)') + 'nije sinhronizovan';
      if (!$('#ntpCfg').contains(document.activeElement)) $('#ntpSrv').value = (t.servers || []).join(' ');
    }

    /* releji */
    if (changed('relays', [s.relays, adm])) {
      const icons = { av2: 'i-game', av3: 'i-game', av4: 'i-game', tuner: 'i-radio', monitor: 'i-tv' }, box = $('#relays'); box.innerHTML = '';
      s.relays.forEach((r, i) => {
        const b = document.createElement('button'); b.className = 'relay'; b.setAttribute('role', 'switch'); b.setAttribute('aria-checked', r.on);
        b.innerHTML = `<span class="ic"><svg class="i"><use href="#${icons[r.role] || 'i-plug'}"/></svg></span><span class="t"><b>${esc(r.n)}</b><small class="muted">GPIO${r.pin}</small></span><span class="rstate viewer">${r.on ? 'Uključeno' : 'Isključeno'}</span><span class="sw adm"></span>`;
        b.onclick = () => isAdmin() ? act('relay', { i, on: !r.on }) : toast('Uključi Admin da menjaš releje');
        box.appendChild(b);
      });
    }

    if (changed('io', s.io)) {
      $('#ioList').innerHTML = (s.io || []).map(x => `<div class="io${x.ok ? ' ok' : ''}"><i></i><span><b>${esc(x.n)}</b><small>${esc(x.d)}</small></span><em>${x.ok ? 'radi' : 'nije povezano'}</em></div>`).join('');
      const io = s.io || []; $('#ioSum').textContent = io.filter(x => x.ok).length + ' od ' + io.length + ' povezano';
    }
    $('#relSum').textContent = (s.relays || []).filter(r => r.on).length + ' od ' + (s.relays || []).length + ' uključeno';

    /* slike */
    $('#imgCount').textContent = s.images.length + (s.images.length % 10 >= 2 && s.images.length % 10 <= 4 && (s.images.length < 10 || s.images.length > 20) ? ' slike' : ' slika');
    $$('#dur button').forEach((b, i) => b.setAttribute('aria-pressed', DURS[i] === s.slide_sec));
    $$('#idleSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === s.idle));
    const slidesOn = s.idle !== 'clock';
    $('#gallery').hidden = !slidesOn; $('#dur').closest('.row').hidden = !slidesOn;
    if (changed('images', s.images)) {
      const gal = $('#gallery'), drop = $('.drop', gal); $$('.ph', gal).forEach(x => x.remove());
      s.images.forEach(n => {
        const d = document.createElement('div'); d.className = 'ph';
        d.innerHTML = `<img src="/img/${encodeURIComponent(n)}" alt="" loading="lazy"><span class="nm">${esc(n)}</span><button class="x adm" aria-label="Obriši ${esc(n)}"><svg class="i"><use href="#i-x"/></svg></button>`;
        d.querySelector('.x').onclick = () => act('img_del', { n });
        gal.insertBefore(d, drop);
      });
    }

    /* daljinski: komande, lista tastera, opisi */
    if (changed('cmds', [s.relays.map(r => r.n), s.names, s.cons])) {
      const sel = $('#irCmd'), v = sel.value; sel.innerHTML = '';
      cmdList().forEach(([g, l]) => { const og = document.createElement('optgroup'); og.label = g;
        l.forEach(([k, t]) => { const o = document.createElement('option'); o.value = k; o.textContent = t; og.appendChild(o); }); sel.appendChild(og); });
      if (v) sel.value = v;
    }
    if (changed('ir', [s.ir, adm, s.names, s.cons, s.relays.map(r => r.n)])) {
      const box = $('#maps'); box.innerHTML = '';
      const groups = {}; s.ir.forEach(m => (groups[group(m.cmd)] = groups[group(m.cmd)] || []).push(m));
      Object.entries(groups).forEach(([g, list]) => {
        const sec = document.createElement('div'); sec.className = 'mgroup'; sec.innerHTML = `<h3>${esc(g)}</h3>`;
        list.forEach(m => {
          const r = document.createElement('div'); r.className = 'map' + (m.code === editCode ? ' editing' : ''); r.dataset.code = m.code; r.tabIndex = 0; r.setAttribute('role', 'button');
          r.innerHTML = `<span class="kc">${esc(m.key)}</span><div class="c"><b>${esc(label(m.cmd))}</b><code>${esc(m.code)}</code></div><div class="acts"><button class="mini adm" data-a="edit" aria-label="Preusmeri na drugu komandu"><svg class="i"><use href="#i-route"/></svg></button><button class="mini danger adm" data-a="del" aria-label="Obriši taster"><svg class="i"><use href="#i-trash"/></svg></button></div>`;
          r.onclick = e => { const b = e.target.closest('.mini'); if (b) { e.stopPropagation(); mapAct(m, b.dataset.a); } else pressCode(m.code); };
          r.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pressCode(m.code); } };
          sec.appendChild(r);
        });
        box.appendChild(sec);
      });
      $('#mapsCnt').textContent = s.ir.length;
    }
    // daljinski: okvir oko broja trenutnog izvora
    const srcKey = { av1: '1', av2: '2', av3: '3', av4: '4', fm: '5', st: '6', tv: '7' }[s.source];
    $$('#remote .rk.num').forEach(b => b.classList.toggle('cur', b.dataset.k === srcKey));
    $('#ytckSt').textContent = s.yt_cookies === 'ok' ? 'Prijava važi' : s.yt_cookies === 'expired' ? 'Prijava je istekla (YouTube je odjavio). Radi i bez nje dok YouTube ne zatraži potvrdu.' : 'Kolačići nisu otpremljeni';
    $('#ytckSt').classList.toggle('ok', s.yt_cookies === 'ok'); $('#ytckDel').hidden = !s.yt_cookies;
    if (changed('rtitles', [s.ir, s.source])) $$('#remote [data-k]').forEach(b => { const m = s.ir.find(x => x.code === KEYS[b.dataset.k]); b.title = b.dataset.k + ': ' + (m ? ctxLabel(m.cmd) : 'nije dodeljen'); });
  }

  setInterval(() => { if (lastSig) { const t = Math.round((Date.now() - lastSig) / 1000); $('#irAgo').textContent = t < 5 ? 'upravo' : t < 60 ? 'pre ' + t + ' s' : 'pre ' + Math.round(t / 60) + ' min'; } }, 1000);
  fetch('/static/consoles.json').then(r => r.json()).then(j => {
    CONSOLES = j;
    ['Av2', 'Av3', 'Av4'].forEach(suf => { const cs = $('#cs' + suf); Object.entries(CONSOLES).forEach(([k, c]) => { const o = document.createElement('option'); o.value = k; o.textContent = k === 'other' ? 'Ostalo' : c.n; cs.appendChild(o); }); });
    delete memo.cons; delete memo.cmds; delete memo.ir; if (S) render();
  }).catch(() => {});
  resetWiz(); rdraw('Teco.Pi', 'Spremno');
  connect();
})();
</script>
</body>
</html>
