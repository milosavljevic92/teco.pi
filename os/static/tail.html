
<div class="evalert" id="evAlert" hidden role="alert"><img id="evImg" alt=""><div><b id="evName"></b><span>upravo sada</span></div></div>

<div class="modal" id="pinModal" hidden>
  <form class="modal-box" id="pinForm">
    <div class="modal-ic"><svg class="i"><use href="#i-lock"/></svg></div>
    <h2 id="pinTitle">Admin režim</h2>
    <p class="muted" id="pinHelp">Unesi PIN.</p>
    <input class="field pin-in" id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="PIN">
    <input class="field pin-in" id="pinIn2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="Ponovi PIN" placeholder="Ponovi PIN" hidden>
    <p class="pin-err" id="pinErr" aria-live="polite"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" type="button" id="pinCancel">Otkaži</button>
      <button class="btn gel" type="submit"><span id="pinOk">Otključaj</span></button>
    </div>
  </form>
</div>

<style>
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(8,12,18,.55);backdrop-filter:blur(4px)}
.modal-box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-lg);text-align:center}
.modal-box h2{justify-content:center;font-size:18px}
.modal-ic{width:48px;height:48px;border-radius:14px;margin:0 auto;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.modal-ic svg.i{width:24px;height:24px}
.pin-in{text-align:center;font:600 22px/1 var(--f-mono);letter-spacing:.4em;height:52px}
.pin-err{min-height:1.3em;margin:0;font-size:13px;color:var(--crit)}
.queue .q{cursor:pointer}
.gallery .ph .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* admin: konzole na AV ulazima */
.src-names{display:flex!important;flex-direction:column;gap:10px;margin-top:0;padding:14px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.sn-head{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sn-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.src-names.off,.sn.off{display:none!important}
.sn{display:grid!important;grid-template-columns:minmax(0,150px) minmax(0,1fr);grid-template-areas:"top top" "art l1" "art f1" "art l2" "art f2";column-gap:12px;align-items:center}
.sn .sn-top{grid-area:top}.sn .sn-art{grid-area:art;align-self:stretch}
@media (max-width:400px){.sn{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "art" "l1" "f1" "l2" "f2"}}
.sn{display:flex;flex-direction:column;gap:6px;min-width:0;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c)}
.sn-top{display:flex;align-items:center;gap:8px;min-width:0}
.sn .tag{flex:none;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.sn-name{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sn-art{aspect-ratio:260/150;max-width:100%;border-radius:10px;background:radial-gradient(110% 90% at 50% 0%,color-mix(in srgb,var(--c) 18%,var(--surface-2)),var(--surface-2) 70%);display:grid;place-items:center;padding:4px}
.sn-art svg{width:100%;height:auto;display:block}
.src-names .sn-l{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
.sn .field{height:38px;font-size:13.5px;padding:0 10px}
.sn select.field{padding-right:30px}
.adminbar{flex-wrap:wrap}
.src[data-src="av1"]{--c:#ff0033}
.hero .card-head{margin:-4px 0 -6px}
#hBack,#hFwd,.wl.left,.wl.right{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ways{display:flex;flex-direction:column;gap:8px}
.way{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.wic{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.wtx{display:flex;flex-direction:column;gap:4px;min-width:0}
.wtx > b{font-size:14px}
.wtx p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.wtx p b{color:var(--text)}
.wtx .inl{width:15px;height:15px;vertical-align:-3px;color:var(--text)}
.bm-mini{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;text-decoration:none;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.bm-mini .grip{width:14px;height:14px;opacity:.8}
.sendhelp > summary .i:first-child{color:var(--muted)}
.send-row{display:flex;flex-direction:column;gap:8px}
.hist-head{display:flex;align-items:center;justify-content:space-between}
.hclr{font-size:12px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:8px}
.hclr:hover{background:var(--surface-3);color:var(--crit)}
.send-row p{margin:0;font-size:13px}
.dragzone{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px;border:2px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:14px;background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.dz-hint{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.dz-hint svg.i{width:15px;height:15px;animation:dzup 1.4s ease-in-out infinite}
@keyframes dzup{50%{transform:translateY(-3px)}}
.sh-bm{cursor:grab!important}.sh-bm:active{cursor:grabbing!important}
.sh-bm .grip{opacity:.8}
.sh-steps{margin:0;padding:0 14px 12px 32px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sh-steps code{font-family:var(--f-mono);font-size:12px;color:var(--text);overflow-wrap:anywhere}
.sendhelp{border-radius:14px;border:1px solid var(--line);background:var(--surface-2)}
.sendhelp > summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-weight:700;font-size:13.5px}
.sendhelp > summary::-webkit-details-marker{display:none}
.sendhelp > summary .i{color:#ff0033}
.sendhelp > summary .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.sendhelp[open] > summary .chev{transform:rotate(180deg)}
.sh-body{display:flex;flex-direction:column;gap:14px;padding:0 14px 14px}
.sh-step{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sh-step p,.sh-step ol{margin:0;color:var(--muted)}
.sh-step ol{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sh-step code{font-family:var(--f-mono);font-size:12.5px;color:var(--text);background:var(--surface);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.sh-bm{align-self:flex-start;text-decoration:none;cursor:grab}
.netcfg{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.netcfg-t,.wifi-head b{font-size:13.5px}
.wifi{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.wifi-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wifi-head .btn{height:34px;padding:0 12px;font-size:12.5px}
.wlist{display:flex;flex-direction:column;gap:6px}
.wn{border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.wn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.wn-row{display:flex;align-items:center;gap:10px;padding:9px 12px;width:100%;text-align:left}
.wn-row b{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wn-row small{font-size:11.5px;color:var(--muted)}
.wn.on .wn-row small{color:var(--accent);font-weight:700}
.wbars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.wbars i{width:3px;background:var(--surface-3);border-radius:1px}
.wbars i:nth-child(1){height:30%}.wbars i:nth-child(2){height:55%}.wbars i:nth-child(3){height:80%}.wbars i:nth-child(4){height:100%}
.wbars i.f{background:var(--text)}
.wn-row svg.i{width:13px;height:13px;color:var(--muted)}
.wn-form{display:flex;gap:6px;padding:0 12px 10px}
.wn-form .field{height:36px;flex:1;min-width:0}
.wn-form .btn{height:36px;padding:0 12px;font-size:12.5px;white-space:nowrap}
.netst{display:grid;gap:8px}
.netst label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.netst .field{flex:none;height:40px;font-family:var(--f-mono);font-size:14px}
/* Alarm (Paradox) */
.alerr{margin:0;font-size:12.5px;color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent);padding:8px 12px;border-radius:10px}
.alparts{display:flex;flex-direction:column;gap:8px}
.alp{--c:var(--ok);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--surface-2);border-left:4px solid var(--c)}
.alp[data-s="armed"]{--c:var(--crit)}.alp[data-s="stay"]{--c:var(--warn)}.alp[data-s="alarm"]{--c:#ff0033;animation:alblink 1s steps(2) infinite}
.alp[data-s="delay"]{--c:var(--warn)}
@keyframes alblink{50%{background:color-mix(in srgb,#ff0033 18%,var(--surface-2))}}
.alp .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.alp .t b{font-size:14.5px}
.alp .t small{font-size:12.5px;font-weight:700;color:var(--c)}
.alp .b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.alp .b .btn{height:36px;padding:0 12px;font-size:12.5px;gap:6px}
.alp .b .btn svg.i{width:15px;height:15px;flex:none;position:relative;z-index:1}   /* katanac, kućica (Stay)… kao na Paradox tastaturi */
.alp .b .btn.dis{background:var(--ok);color:#fff;border-color:transparent}
.alp .b .btn.arm{background:var(--crit);color:#fff;border-color:transparent}
.alzhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.alzhead .segc{margin-left:auto}
.alzones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}

.alz{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:12.5px;min-width:0}
.alz i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.alz span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alz em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.alz.open i{background:var(--warn)}.alz.open em{color:var(--warn)}
.alz.byp{opacity:.55}.alz.byp i{background:var(--faint)}
.alz.alarm{background:color-mix(in srgb,#ff0033 14%,var(--surface-2))}.alz.alarm i{background:#ff0033}.alz.alarm em{color:#ff0033}

#alCard{order:2}   /* na telefonu odmah posle Hub-a */
.alz .mem{flex:none;font-size:10px;font-weight:800;color:#ff0033;background:color-mix(in srgb,#ff0033 12%,transparent);padding:2px 5px;border-radius:5px}
.alpgms{display:flex;flex-direction:column;gap:6px}
.alg{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13px}
.alg i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--faint)}.alg i.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.alg span:not(.b){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.alg .b{display:flex;gap:4px}.alg .b .btn{height:30px;padding:0 9px;font-size:12px}
.alpall summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 2px}
.alpall[open]{display:flex;flex-direction:column;gap:6px}
/* meni sa strane (stablo): Multimedija, Alarm, CCTV */
.side{position:fixed;top:0;bottom:0;left:0;z-index:45;width:236px;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.side-logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;padding:4px 6px 8px}
.side-logo .mark{width:30px;height:30px}
.tree{display:flex;flex-direction:column;gap:6px}
.tsec{width:100%;display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;background:transparent;border:0;font:800 14px/1 var(--f-body);color:var(--text);cursor:pointer;text-align:left}
.tsec svg.i{width:19px;height:19px;color:var(--muted)}
.tsec small{margin-left:auto;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.tsec:hover{background:var(--surface-2)}
.tgrp.on>.tsec{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.tgrp.on>.tsec svg.i{color:var(--accent)}
.tsec .tdot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:transparent}
.tdot[data-s="off"]{background:var(--ok)}.tdot[data-s="armed"]{background:var(--crit)}.tdot[data-s="err"]{background:var(--warn)}
.tdot[data-s="alarm"]{background:#ff0033;animation:alblink 1s steps(2) infinite}
.titems{display:none;flex-direction:column;gap:1px;margin:2px 0 6px 20px;padding-left:12px;border-left:2px solid var(--line)}
.tgrp.on .titems{display:flex}
.titems a{padding:7px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.titems a:hover{background:var(--surface-2);color:var(--text)}
.tgrp[data-view="cctv"] .tsec{opacity:.75}
.tsep{height:1px;margin:8px 6px;background:var(--line)}
.tadm .tadm-on{display:none;color:#b45309}
.tadm[aria-checked="true"]{background:color-mix(in srgb,#f59e0b 16%,transparent);color:#b45309}
.tadm[aria-checked="true"] svg.i{color:#d97706}
.tadm[aria-checked="true"] .tadm-on{display:inline}
.navbtn{display:none;width:40px;height:40px;border-radius:12px;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--text);flex:none;cursor:pointer}
.navbtn svg.i{width:20px;height:20px}
.side-bg{position:fixed;inset:0;z-index:44;background:rgba(10,14,20,.45);animation:rfade .15s ease-out}

/* Akvarijum kao tehnički (CAD) prikaz: izometrijsko staklo, skrivene ivice isprekidano, kota nivoa, plovni senzori na šipki,
   oprema (LED letva, grejač, pumpa, aerator) menja izgled po stanju sa modula */
.aqtank{position:relative;border-radius:12px;border:1px solid var(--line);overflow:hidden;--ln:var(--text);--dim:var(--muted);
  background:linear-gradient(var(--surface),var(--surface)) padding-box;
  background-image:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px);
  background-size:20px 20px;background-color:var(--surface-2)}
.aqtank svg{display:block;width:100%;height:auto}
.aqtank .gl{fill:none;stroke:var(--ln);stroke-width:1.4;stroke-linejoin:round;opacity:.75}
.aqtank .hid{fill:none;stroke:var(--ln);stroke-width:1;stroke-dasharray:5 4;opacity:.35}
.aqtank .dm{stroke:var(--dim);stroke-width:1;fill:none}
.aqtank .dt{fill:var(--dim);font:600 10.5px var(--f-mono,monospace);letter-spacing:.04em}
.aqtank .dt.b{fill:var(--ln);font-weight:700}
.aqtank .al{fill:var(--crit)}
.aqtank .wf{transition:all .8s var(--ease-out,ease)}
.aqtank .cone{opacity:0;transition:opacity .8s}.aqtank.lit .cone{opacity:.42}
.aqtank .led{stroke:#4b5563;transition:stroke .5s}.aqtank.lit .led{stroke:var(--lc);filter:drop-shadow(0 0 4px var(--lc))}
.aqtank .hcore{fill:#6b7280;transition:fill .5s}.aqtank.heat .hcore{fill:#f97316;filter:drop-shadow(0 0 5px #fb923c)}
.aqtank .pled{fill:#6b7280}.aqtank.pump .pled{fill:#22c55e;filter:drop-shadow(0 0 3px #22c55e)}
.aqtank .bub{opacity:0;transition:opacity .6s}.aqtank.air .bub{opacity:1}
.aqtank .bub circle{fill:rgb(255 255 255/.25);stroke:rgb(255 255 255/.85);stroke-width:1;animation:aqrise 2.8s linear infinite}
.aqtank .bub circle:nth-child(2){animation-delay:-.7s}.aqtank .bub circle:nth-child(3){animation-delay:-1.4s}.aqtank .bub circle:nth-child(4){animation-delay:-2.1s}
.aqtank .bub circle:nth-child(5){animation-delay:-.35s;animation-duration:3.3s}.aqtank .bub circle:nth-child(6){animation-delay:-1.75s;animation-duration:3.3s}
@keyframes aqrise{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(calc(var(--rise) * -1px));opacity:0}}
.aqtank .surf{animation:aqsurf 4s ease-in-out infinite alternate}
@keyframes aqsurf{to{opacity:.55}}
.aqtank .bub circle{stroke-width:1.2}
@keyframes aqrise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}35%{transform:translate(3px,calc(var(--rise) * -.35px))}65%{transform:translate(-3px,calc(var(--rise) * -.65px))}90%{opacity:1}100%{transform:translate(1px,calc(var(--rise) * -1px));opacity:0}}
.aqtank .wave{animation:aqwv 2.6s linear infinite}.aqtank .wave.w2{animation-duration:4.2s;animation-direction:reverse}
@keyframes aqwv{to{transform:translateX(80px)}}
.aqtank .wl{stroke:#e0f2fe;stroke-width:2;animation:aqwl 1.8s ease-in-out infinite alternate}
@keyframes aqwl{from{opacity:.35}to{opacity:1}}
.aqtank .cau{fill:#fff;opacity:0;transition:opacity .8s}
.aqtank.lit .cau{opacity:.13;fill:var(--lc);animation:aqcau 6s ease-in-out infinite alternate}
@keyframes aqcau{from{transform:translateX(-24px)}to{transform:translateX(24px)}}
.aqtank:not(.lit) .wf{filter:brightness(.72) saturate(.8)}
.aqtank .imp{transform-box:view-box}.aqtank.pump .imp{animation:aqspin .6s linear infinite}
@keyframes aqspin{to{transform:rotate(360deg)}}
.aqtank .flow{fill:none;stroke:#e0f2fe;stroke-width:2;stroke-dasharray:6 10;stroke-linecap:round;opacity:0;transition:opacity .5s}
.aqtank.pump .flow{opacity:.75;animation:aqflow .9s linear infinite}.aqtank.pump .flow.f2{opacity:.45;animation-duration:1.3s}
@keyframes aqflow{to{stroke-dashoffset:-32}}
.aqtank.heat .hcore{animation:aqheat 1.6s ease-in-out infinite alternate}
.aqtank .hglow{opacity:0;transition:opacity .6s}.aqtank.heat .hglow{opacity:1;animation:aqwl 1.6s ease-in-out infinite alternate}
.aqtank .heatw path{fill:none;stroke:#f97316;stroke-width:1.8;stroke-linecap:round;opacity:0}
.aqtank.heat .heatw path{animation:aqhw 1.8s ease-out infinite}
@keyframes aqhw{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
.aqtank .hon,.aqtank.heat .hoff{display:none}.aqtank.heat .hon{display:inline;fill:#ea580c;font-weight:700}
.aqtank.heat .hlab text.b{fill:#ea580c}.aqtank.heat .hlab .dm{stroke:#f97316}
@keyframes aqheat{from{filter:drop-shadow(0 0 2px #fb923c)}to{filter:drop-shadow(0 0 9px #f97316)}}
.aqleg{display:flex;flex-wrap:wrap;gap:6px}
.aqleg span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.aqleg i{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.aqleg span.on{color:var(--text);border-color:color-mix(in srgb,var(--c) 60%,var(--line));background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.aqleg span.on i{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent);animation:aqwl 1.2s ease-in-out infinite alternate}
#aqOuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.aqo{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1.5px solid var(--line);transition:background .25s,border-color .25s,box-shadow .25s}
.aqi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--surface);filter:grayscale(1);opacity:.55;transition:filter .25s,opacity .25s,background .25s,box-shadow .25s}
.aqo .t b{display:block;font-size:15px}.aqo .t small{font-size:12px;color:var(--muted)}
.aqbadge{font-size:10px;font-weight:900;letter-spacing:.08em;padding:4px 8px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.aqo.on{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 22%,var(--surface-2)),color-mix(in srgb,var(--ok) 8%,var(--surface-2)));border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent),0 6px 18px color-mix(in srgb,var(--ok) 22%,transparent)}
.aqo.on .aqi{filter:none;opacity:1;background:color-mix(in srgb,var(--ok) 25%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--ok) 45%,transparent)}
.aqo.on .t b{color:var(--text)}.aqo.on .t small{color:var(--ok);font-weight:800}
.aqo.on .aqbadge{background:var(--ok);color:#04230f}
.aqo.busy .aqbadge{animation:drpulse 1s ease-in-out infinite}
.aqo.off.on{border-style:dashed}
.aqst{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
/* PANIC na Alarm strani: crveno dugme koje se puni dok se drži 2 s */
.alpanic{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--crit) 45%,var(--line));background:color-mix(in srgb,var(--crit) 6%,var(--surface-2))}
.alpanic .segc button{font-size:12.5px}
.panicbtn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border-radius:14px;background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 6px 18px rgb(239 68 68/.35),inset 0 1px 0 rgb(255 255 255/.25);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .15s}
.panicbtn b{position:relative;font-size:22px;letter-spacing:.18em;font-weight:900}.panicbtn small{position:relative;font-size:11.5px;opacity:.85;font-weight:700}
.panicbtn .pf{position:absolute;inset:0;width:0;background:rgb(127 29 29/.75)}
.panicbtn.holding{transform:scale(.98)}.panicbtn.holding .pf{width:100%;transition:width 2s linear}
.panicbtn.sent{animation:drpulse .6s ease-in-out infinite}.panicbtn.sent small::after{content:" · poslato"}
/* ===== Smart Home: jasno uključeno / isključeno + animacije (svetla, uređaji, akvarijum, primeri, pločice) ===== */
@keyframes onglow{0%,100%{box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 22%,transparent),0 6px 16px color-mix(in srgb,var(--ok) 16%,transparent)}50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 34%,transparent),0 8px 26px color-mix(in srgb,var(--ok) 30%,transparent)}}
@keyframes bulbglow{0%,100%{box-shadow:0 0 0 2px rgb(251 191 36/.25),0 6px 18px rgb(251 191 36/.18)}50%{box-shadow:0 0 0 4px rgb(251 191 36/.4),0 8px 30px rgb(251 191 36/.38)}}
@keyframes bulbicon{0%,100%{box-shadow:0 0 14px rgb(251 191 36/.45)}50%{box-shadow:0 0 30px rgb(251 191 36/.85)}}
@keyframes shspin{to{transform:rotate(360deg)}}
@keyframes shheat{0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 0 rgb(249 115 22/0))}50%{transform:translateY(-2px) scale(1.1);filter:drop-shadow(0 0 6px rgb(249 115 22/.7))}}
@keyframes shpop{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes dotpulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--ok) 6%,transparent)}}
/* uključeni uređaji (Uređaji, primeri, akvarijum): zelena kartica koja diše */
#applGrid .dr,.dv,.aqo{transition:background .3s,border-color .3s,transform .2s}
#applGrid .dr.on,.dv.on,.aqo.on{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 22%,var(--surface-2)),color-mix(in srgb,var(--ok) 7%,var(--surface-2)));border-color:var(--ok);animation:onglow 2.6s ease-in-out infinite,shpop .45s ease-out}
#applGrid .dr.on .dri,.dv.on .dvi{background:color-mix(in srgb,var(--ok) 25%,transparent);border-radius:12px;box-shadow:0 0 16px color-mix(in srgb,var(--ok) 40%,transparent)}
#applGrid .dr.on .t small,.dv.on .t small{color:var(--ok);font-weight:800}
#applGrid .dr:not(.on) .dri .em,.dv:not(.on) .dvi{filter:grayscale(1);opacity:.55}
.dvi{width:40px;height:40px;display:grid;place-items:center;line-height:1}
/* animirane ikonice dok rade */
.em{display:inline-block}
.on[data-anim=spin] .em,.dv.on[data-anim=spin] .dvi>span{animation:shspin 1.6s linear infinite}
.on[data-anim=heat] .em{animation:shheat 1.4s ease-in-out infinite}
.aqo.on[data-anim=bulb] .aqi{animation:bulbicon 2.2s ease-in-out infinite;background:rgb(251 191 36/.3)}
/* svetla: žuto */
.dl{transition:background .3s,border-color .3s}
.dl.on{background:linear-gradient(135deg,rgb(251 191 36/.2),rgb(251 191 36/.05)),var(--surface-2);border-color:#fbbf24;animation:bulbglow 2.6s ease-in-out infinite,shpop .45s ease-out}
.dl.on .dlt{animation:bulbicon 2.2s ease-in-out infinite}
.dl.on .t small{color:#d97706;font-weight:800}
.dl:not(.on) .dlt{opacity:.6}
/* prekidač: odskoči, zelen kad je uključen */
.dvs{transition:background .25s,box-shadow .25s}.dvs::after{transition:transform .35s cubic-bezier(.34,1.56,.64,1),width .2s;box-shadow:0 1px 3px rgb(0 0 0/.3)}
.dvs:active::after{width:28px}
.dvs[aria-checked="true"]{background:var(--ok);box-shadow:0 0 12px color-mix(in srgb,var(--ok) 55%,transparent)}
/* pločice na Smart Home strani: zasvetle kad je nešto uključeno */
.shtile{transition:border-color .3s,background .3s,transform .15s}.shtile:active{transform:scale(.98)}
.shtile.act{border-color:var(--ok);background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 14%,var(--surface-2)),var(--surface-2));animation:onglow 3s ease-in-out infinite}
.shtile.act svg.i{color:var(--ok)}
.shtile.warn{border-color:var(--warn);background:linear-gradient(135deg,color-mix(in srgb,var(--warn) 16%,var(--surface-2)),var(--surface-2))}
.shtile.warn svg.i{color:var(--warn)}
.shdot.lg{animation:dotpulse 1.8s ease-in-out infinite}

html.boot body::after{content:'';position:fixed;left:50%;top:46%;width:44px;height:10px;margin-left:-22px;
  background:radial-gradient(circle closest-side,var(--accent) 90%,transparent) 0 50%/10px 10px no-repeat,radial-gradient(circle closest-side,var(--accent) 90%,transparent) 50% 50%/10px 10px no-repeat,radial-gradient(circle closest-side,var(--accent) 90%,transparent) 100% 50%/10px 10px no-repeat;
  animation:bootDots 1s ease-in-out infinite;opacity:.8}
@keyframes bootDots{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:.9;transform:scale(1)}}
html.booted header.top{animation:pgIn .42s cubic-bezier(.2,.7,.2,1) backwards}
html.booted main.wrap{animation:pgIn .5s .07s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes pgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
html.leaving header.top,html.leaving main.wrap{opacity:0;transition:opacity .16s ease}
.evlist{display:flex;flex-direction:column;gap:12px}
.drop.sndup{aspect-ratio:auto;height:64px;flex-direction:row;gap:8px}
#evCard .card-head{gap:10px}.evsel{width:auto;min-width:0;max-width:60%;height:38px;font-weight:700}
.ev .evtone .field{flex:1;min-width:0;height:36px}.ev .evtone .btn{height:36px;padding:0 12px}
.ev{display:block;padding:12px;border-radius:14px;background:var(--surface-2)}
.ev.off{opacity:.6}
.ev img{width:100%;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:#0b1018}
.ev-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.ev-top{display:flex;gap:8px;align-items:center}
.ev-top .field{height:38px;font-weight:700}
.ev .swb{flex:none;background:none;border:0;padding:0;cursor:pointer}
.ev .swb .sw{display:block}
.ev-top .field{flex:1;min-width:0;width:auto}
.ev-top .ev-n{flex:1;min-width:0;font-size:15px;display:flex;align-items:center;gap:8px}
.ev-top .ev-n::after{content:'ALARM';font:800 10px/1 var(--f-body);letter-spacing:.08em;padding:4px 6px;border-radius:6px;color:#ef4444;background:color-mix(in srgb,#ef4444 14%,transparent)}
.ev .swb[aria-checked="true"] .sw{background:var(--accent)}
.ev .swb[aria-checked="true"] .sw::after{transform:translateX(18px)}
.ev .row{justify-content:flex-start;gap:8px;font-size:13px}
.ev .evsec{width:72px;height:34px;text-align:center;font-weight:700}
.ev .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.ev .chk input{accent-color:var(--accent);width:16px;height:16px}
.ev-snd{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.ev-snd b{color:var(--text)}
.ev-snd code{font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}
.ev-btns{display:flex;gap:6px;flex-wrap:wrap}
.ev-btns .btn{height:34px;padding:0 12px;font-size:12.5px}
.ev-btns label.btn{position:relative;overflow:hidden}
.ev-btns label.btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:420px){.ev{grid-template-columns:minmax(0,1fr)}}
.evalert{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:16px;background:var(--text);color:var(--surface);box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:evin .3s ease-out}
.evalert img{width:72px;aspect-ratio:16/9;border-radius:8px;object-fit:cover}
.evalert b{display:block;font-size:15px}
.evalert span{font-size:12.5px;opacity:.7}
@keyframes evin{from{transform:translate(-50%,-20px);opacity:0}}
#rebootBtn{margin-top:14px;width:100%;height:44px;justify-content:center;color:#dc2626;background:color-mix(in srgb,#dc2626 8%,transparent);border:1.5px solid color-mix(in srgb,#dc2626 45%,transparent);font-weight:700}
#rebootBtn:hover{background:color-mix(in srgb,#dc2626 14%,transparent)}
#castCard{order:8}
.smbinst,.smbmain{display:flex;flex-direction:column;gap:10px}
.smbbar{height:4px;border-radius:2px;background:var(--surface);margin-top:5px;overflow:hidden}
.smbbar i{display:block;height:100%;background:var(--accent)}
.smbpath{font-family:var(--f-mono);font-size:12px;user-select:all}
.sideshare{display:flex;align-items:center;gap:10px;margin-top:auto;flex:none;padding:10px 12px;border-radius:12px;border:1px solid color-mix(in srgb,var(--text) 12%,transparent);background:transparent;color:inherit;font:600 13.5px var(--f-body);cursor:pointer;transition:background-color .2s}
.sideshare:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}.sideshare svg.i{width:18px;height:18px}
body.side-mini .sideshare span{display:none}
.pwapop{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:16px;background:rgba(5,8,12,.55);backdrop-filter:blur(4px)}.pwapop[hidden]{display:none}
.pwamodal{width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;animation:vin .35s var(--ease-out,ease) both}.pwax{margin-left:auto;width:36px;height:36px;padding:0}
.pwa-vpn{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.pwa-pc{display:flex;align-items:center;gap:14px}
.pwa-qr{flex:none;width:132px;height:132px;padding:8px;border-radius:12px;background:#fff;display:grid;place-items:center}
.pwa-qr svg{width:100%;height:100%}
.pwag{position:fixed;inset:0;z-index:90;background:rgba(5,8,14,.72);display:flex;align-items:center;justify-content:center;padding:20px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pwag-card{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;border-radius:20px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);text-align:center}
.pwag-ic{width:64px;height:64px;border-radius:15px}
.pwag-card ol{margin:0;padding-left:22px;text-align:left;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.pwag-card ol b{color:var(--accent-2)}
.pwag-arrow{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:44px;height:44px;margin-left:-22px;color:#2dd4bf;animation:pwab 1s ease-in-out infinite}
.pwag-arrow.top{bottom:auto;top:calc(6px + env(safe-area-inset-top,0px));left:auto;right:8px;margin:0;transform:rotate(180deg);animation-name:pwat}
@keyframes pwab{50%{transform:translateY(8px)}}
@keyframes pwat{0%,100%{transform:rotate(180deg)}50%{transform:rotate(180deg) translateY(8px)}}
.smbacc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.smbacc label{min-width:0}
.smbacc .field{flex:none;width:100%;height:40px;min-width:0;box-sizing:border-box}
.smbrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.smbup,.smbgames,.smbbrowse{display:flex;flex-direction:column;gap:8px}
.smbdrop{display:flex;align-items:center;gap:12px;padding:16px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;color:var(--muted)}
.smbdrop b{color:var(--text)}
.smbdrop svg.i{width:26px;height:26px;flex:none;color:var(--accent)}
.smbdrop input{display:none}

.smbprog{padding:10px;border-radius:12px;background:var(--surface-2)}
.smbprog-t{display:flex;align-items:center;gap:10px;font-size:13px}
.smbprog-t b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smbprog-t span{color:var(--muted);font-variant-numeric:tabular-nums}
.smbprog-t .btn{height:30px;padding:0 10px;font-size:12px}
.smbbrowse{padding:10px;border-radius:12px;border:1px solid var(--line)}
.smbbr-h{display:flex;flex-direction:column;gap:2px;font-size:13.5px}
.smbbr-l{display:flex;flex-direction:column;max-height:240px;overflow:auto;border-radius:10px;background:var(--surface-2)}
.smbbr-l button{display:flex;align-items:center;gap:8px;padding:9px 10px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line)}
.smbbr-l button:last-child{border-bottom:0}
.smbbr-l svg.i{width:16px;height:16px;color:var(--muted);flex:none}
.smbbr-b{display:flex;gap:6px;flex-wrap:wrap}
#accCard{order:9} #sendCard{order:20}
.acc-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:var(--surface-2);text-align:left}
.acc-row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acc-row .t b{font-size:14.5px}
.acc-row .t span{font-size:12.5px;color:var(--muted)}
.acc-row[aria-checked="true"] .sw{background:var(--accent)}
.acc-row[aria-checked="true"] .sw::after{transform:translateX(18px)}
/* izlaz zvuka, Bluetooth, mreža */
.outs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.outs .ol{font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px;margin-right:2px}
.och{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:12.5px;color:var(--text)}
.och svg.i{width:15px;height:15px;color:var(--muted)}
.och[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.och[aria-pressed="true"] svg.i{color:var(--accent)}
.outs{flex-direction:column;align-items:stretch;gap:8px}
.orow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.orow .ol{min-width:76px}
.ogrp{display:inline-flex;align-items:center;border-radius:999px}
.ogrp .och{border-top-right-radius:0;border-bottom-right-radius:0;border-right:0;padding-right:10px}
.och-x{display:grid;place-items:center;width:32px;height:32px;border-radius:0 999px 999px 0;border:1px solid var(--accent);border-left:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft);color:var(--accent-2)}
.och-x svg.i{width:14px;height:14px}
.ogrp .och[aria-pressed="false"]+.och-x{border-color:var(--line);background:var(--surface-2);color:var(--muted)}
.och-x:hover{background:color-mix(in srgb,#dc2626 14%,transparent);color:#dc2626}
.och.och-bt{border-style:dashed;color:var(--muted);background:transparent}
.och.och-bt .plus{font-weight:800;color:var(--accent);margin-left:2px}
.och.och-bt:hover{border-style:solid;color:var(--text)}
.och:disabled,.och-x:disabled{opacity:.55}
.acc-row:disabled{opacity:.55;cursor:not-allowed}
#btCard{order:7} #netCard{order:8}
.btlist{display:flex;flex-direction:column;gap:6px}
.btd{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--surface-2)}
.btd .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.btd.conn .ic{background:var(--accent-soft);color:var(--accent)}
.btd .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btd .t span{font-size:12px;color:var(--muted)}
.btd .bb{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.btd .btn{height:34px;padding:0 12px;font-size:12.5px}
.netinfo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13.5px}
.netinfo dt{color:var(--muted)}
.netinfo dd{margin:0;font-family:var(--f-mono);font-size:13px;overflow-wrap:anywhere}
.netinfo a{color:var(--accent)}
/* prozor sa temperaturama */
.tcard{padding:14px 18px}
.tgrid{display:flex;gap:14px}
.tbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tbox:not([hidden]) ~ .tbox:not([hidden]){border-left:1px solid var(--line);padding-left:14px}
.tbox .k{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c)}

.tbox .v{display:flex;align-items:baseline;gap:4px}

.tbox .v .hum{margin-left:6px;font-size:13px;white-space:nowrap}
.tbox .spark{width:100%;height:26px;display:block;margin-top:4px}
/* gornja traka: logo + Daljinski u prvom redu, statusi + Admin u drugom (preko cele širine) */

.top-in .rtop{margin-left:auto}

.top-in .chips::-webkit-scrollbar{display:none}
.top-in .chip{flex:none}
.top-in .sbar{flex:1 0 auto;height:38px;border-radius:12px;padding:0 4px 0 0;gap:0}
.sbar .schip{flex:1 0 auto;justify-content:center;height:100%;border:0;background:transparent}
.sbar>.sep{width:1px;height:18px;background:var(--line);flex:none}
.sbar .admin-sw{flex:none;height:30px;margin-left:4px;padding:0 10px 0 4px;gap:5px;border:0;border-radius:9px;background:transparent;font-size:12.5px}
.sbar .admin-sw .lk{width:22px;height:22px;border-radius:7px}
.sbar .admin-sw .lk svg.i{width:13px;height:13px}

.sbar:has(.schip:hover){border-color:var(--accent)}
.sbar .schip:hover{border:0}
@media (max-width:420px){
  .top-in .sbar{flex:1 1 auto;min-width:0}
  .sbar .schip{flex:1 1 auto;padding:0 4px 0 8px;gap:3px;font-size:12px}
  .sbar .schip b{font-size:11.5px}
  .sbar .schip .sep{margin:0 2px}
  .sbar .admin-sw{margin-left:2px;padding:0 6px 0 3px;gap:4px;font-size:12px}
}
.rtop{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:12px;background:var(--accent);border:0;color:#fff;font:inherit;font-weight:800;font-size:13.5px;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}

.admin-sw{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:12px;background:transparent;border:1.5px dashed var(--faint);color:var(--muted);font-weight:800;font-size:13.5px;letter-spacing:.02em;transition:background .2s,border-color .2s,color .2s}
.admin-sw .lk{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}

.admin-sw:hover{border-color:var(--accent);color:var(--text)}
.admin-sw[aria-checked="true"]{background:var(--accent);border:1.5px solid transparent;color:var(--accent-ink);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.admin-sw[aria-checked="true"] .lk{background:rgba(255,255,255,.22);color:#fff}

.rk.num{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px}

html.admin #lcd,html.admin #fmLcd,html.admin #stLcd,html.admin #tvLcd,html.admin .fmctl,html.admin .transport,html.admin .volbox,

/* brzi daljinski: plutajuće dugme i prozor */

.schip{cursor:pointer;font:inherit;color:inherit}

.rclose{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:14px;

.syssheet{align-items:stretch}

/* YouTube lista: kompaktnije */
.queue{gap:0}
.qmore{list-style:none;display:flex;justify-content:center;padding-top:4px}
#hist .q{padding-top:4px;padding-bottom:4px}
#hist .q .qa{width:30px;height:30px}
#hist .q .t{font-size:13px;-webkit-line-clamp:1}
.q{gap:10px;padding:5px 8px;grid-template-columns:36px minmax(0,1fr) auto auto;border-radius:12px}
.q .qa{width:36px;height:36px;border-radius:9px}
.q .t{font-size:13.5px}
.q .s,.q .d{font-size:11.5px}
.q .mini{width:30px;height:30px}
.queue .q:not(.pend):not(.perr) .s{display:none}   /* "YouTube" ispod svakog naslova je suvišno */
#seek,#dial{touch-action:pan-y}
#rDisp .l2{display:block;overflow:hidden;white-space:nowrap}
#rDisp .l2 .mq{display:inline-block;white-space:nowrap}
#rDisp .l2.marq .mq{animation:rmarq linear infinite}
@keyframes rmarq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rk.num.cur{box-shadow:0 0 0 2.5px var(--accent),0 2px 6px color-mix(in srgb,var(--accent) 40%,transparent)}
.rk.num[data-k="1"].cur{box-shadow:0 0 0 2.5px #ff0033,0 2px 6px rgba(255,0,51,.35)}
/* bez zumiranja na telefonu: dvostruki dodir ne zumira, a polja imaju 16 px da iPhone ne zumira sam */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
@media (max-width:560px){input.field,select.field,textarea.field,.field{font-size:16px}}
/* aplikacija sa početnog ekrana (PWA): stranica ide ispod iPhone statusne trake, zaglavlje je pokriva */
@media (display-mode:standalone){
  header.top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg)}
  .side{padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .rsheet-in{padding-top:calc(16px + env(safe-area-inset-top,0px))}
}
html.admin body{padding-bottom:84px}
/* mini plejer uz donju ivicu */
.mbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:34;width:min(600px,calc(100% - 16px));display:flex;align-items:center;gap:8px;padding:9px 10px 9px 14px;border-radius:20px;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transform:translate(-50%,calc(100% + 20px)) scale(.96);transition:transform .28s cubic-bezier(.2,.9,.25,1.1),opacity .2s ease-out}
.mbar.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.mbar[hidden]{display:none}
.mb-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.mb-info b{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.mb-info #mbTitle{font-size:14.5px;font-weight:700;overflow:hidden;white-space:nowrap;display:block}
.mb-info #mbTitle .mq{display:inline-block;white-space:pre}
.mb-info #mbTitle.marq{-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mb-info #mbTitle.marq .mq{animation:rmarq linear infinite}
.mb-ctl,.mb-vol{display:flex;align-items:center;gap:2px;flex:none}
.mb-ctl[hidden]{display:none}
.mbar button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text);font:700 21px/1 var(--f-body)}
.mbar button:active{background:var(--surface-3)}
.mbar button svg.i{width:20px;height:20px}
.mbar .mb-play{width:46px;height:46px;background:var(--accent);color:#fff}
.mb-vol{padding-left:6px;border-left:1px solid var(--line)}
.mbar .mb-mute{width:auto;min-width:40px;padding:0 6px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:0;transition:background .25s,color .25s}
.mb-mute svg.i{width:0!important;opacity:0;transition:width .25s,opacity .25s,margin .25s}
.mb-mute span{min-width:24px;text-align:center;font-size:13.5px;font-weight:800;color:var(--muted);transition:color .25s}
.mb-mute.on{background:color-mix(in srgb,#ff0033 12%,transparent);color:#ff0033}
.mb-mute.on svg.i{width:18px!important;opacity:1}
.mb-mute.on span{min-width:0}
/* utišano: ista crvena kao YT taster na daljinskom, sa prelazom */
.vbtn{transition:background .25s,color .25s,border-color .25s}
.vbtn.on{background:color-mix(in srgb,#ff0033 12%,var(--surface));color:#ff0033;border-color:color-mix(in srgb,#ff0033 45%,var(--line))}
#volV{transition:color .25s}
.volbox:has(.vbar.muted) #volV{color:#ff0033}
.vbar i{transition:background .25s,height .12s}
.rk{transition:box-shadow .25s,color .25s,transform .08s}
.rk[data-k="Power"].arming{box-shadow:0 0 0 2.5px #ef4444,0 0 12px rgba(239,68,68,.5);animation:parm 1s ease-in-out infinite}
@keyframes parm{50%{box-shadow:0 0 0 4px #ef4444,0 0 18px rgba(239,68,68,.7)}}
.rk[data-k="Mute"].cur{box-shadow:0 0 0 2.5px #ff0033,0 2px 6px rgba(255,0,51,.35);color:#ff0033}
/* dugmad plejera i daljinskog: dugo držanje ne selektuje tekst, ne otvara meni i ne zumira */
.transport,.volbox,.fmctl,.mbar,#remote,.srcs,.standby,.vbar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.transport button,.volbox button,.fmctl button,.mbar button,#remote button,.src,.avpick button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bump{animation:vbump .18s ease-out}
@keyframes vbump{from{transform:scale(1.18)}to{transform:scale(1)}}
#volV,#mbVol{display:inline-block}
body.mb-on{padding-bottom:84px}
body.mb-on .rfab{display:none}   /* daljinski je tada u mini plejeru */
.mbar .mb-rc{background:var(--surface-2);border:1px solid var(--line)}
@media (max-width:400px){.mbar{gap:4px;padding-left:12px}.mbar button{width:36px;height:36px}.mbar .mb-play{width:42px;height:42px}}
/* Teco.Pi nije dostupan: poruka preko zatamnjene i zamućene stranice */
.offline{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:20px;background:rgba(10,14,20,.45);-webkit-backdrop-filter:blur(4px) grayscale(.6);backdrop-filter:blur(4px) grayscale(.6);animation:rfade .2s ease-out}
.offline[hidden]{display:none}
.offbox{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 22px;border-radius:22px;background:var(--surface);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.offic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,#ef4444 14%,transparent);color:#ef4444}
.offic svg.i{width:26px;height:26px}
.offbox b{font-size:18px}
.offbox p{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.offtry{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.offtry .spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.is-offline{overflow:hidden}   /* mesto za admin traku na dnu */
html.admin .rfab{display:none}
.srcb{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#ff0033;color:#fff;box-shadow:0 0 0 2px var(--surface)}
.srcb.cast{background:#2563eb}
.srcb svg.i{width:11px;height:11px;stroke-width:2.6}
.q.cur .srcb{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 12%,var(--surface))}
#hist{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
#hist[hidden]{display:none}
/* telefon: naslov dobija svu širinu, trajanje ide ispod, dugmad manja */
@media (max-width:480px){
  .q{grid-template-columns:36px minmax(0,1fr) auto;grid-template-areas:"art txt act" "art dur act";gap:1px 10px;padding:6px 4px}
  .q > :nth-child(1){grid-area:art;width:36px;height:36px}
  .q > :nth-child(2){grid-area:txt}
  .q > :nth-child(3){grid-area:dur;font-size:11.5px}
  .q > :nth-child(4){grid-area:act}
  .q .mini{width:30px;height:30px}
.queue .q:not(.pend):not(.perr) .s{display:none}   /* "YouTube" ispod svakog naslova je suvišno */
  .acts{gap:0}
  .add{flex-wrap:wrap}
  .add .field{flex:1 1 100%}
  .add .btn{flex:1}
  .src{flex-direction:column;align-items:flex-start;gap:8px;padding:10px}
  .stlist{grid-template-columns:minmax(0,1fr)!important}
  .bootrow{flex-direction:column;align-items:stretch;gap:6px}
  .bootrow .field{max-width:none}
  .stat .v{font-size:26px}
  .stat .v small,.stat .v .u{font-size:13px}
}
.ev .evsec{flex:0 0 72px;width:72px}
.hist-head{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-left:6px}
.q.hist{cursor:pointer}
.q.hist .qa .hp{width:16px;height:16px;color:#fff;opacity:0;transition:opacity .15s}
.q.hist:hover .qa .hp{opacity:.9}
@media (hover:none){.q.hist .qa .hp{opacity:.8}}
.hist-more{align-self:center;height:36px;font-size:13px;color:var(--accent)}
.q.pend{cursor:default;opacity:.92}
.q.pend .qa{background:var(--surface-3)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pbar{height:3px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;width:35%;border-radius:3px;background:var(--accent);animation:pbar 1.4s ease-in-out infinite}
@keyframes pbar{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.q.perr .s{color:var(--crit)}
.q.perr .spin{animation:none;border-color:var(--crit)}
.fm-err{font-size:13px;padding:8px 12px;border-radius:12px;background:color-mix(in srgb,var(--crit) 10%,transparent);border:1px solid color-mix(in srgb,var(--crit) 30%,transparent)}
/* ===== Alati: jedan stil (kao Smart Home / Multimedija) — kartice, naslovi sa SVG ikonicom, čipovi, polja, mala dugmad ===== */
#toolsCard :is(.phcard,.sccard,.pvgen,.pvedit,.pvlock,.snadd,.dnsum,.ntsum,.smst,.phs,.nti,.sni,.smc,.pvi,.rsprev,.dntab,.smmsgs){border-radius:14px;border:1px solid var(--line)}
#toolsCard :is(.phs.ok,.smst.ok){border-color:var(--ok)}#toolsCard :is(.phs.bad,.smst.bad){border-color:var(--crit)}#toolsCard .phs.act{border-color:var(--accent)}
#toolsCard :is(.pxr,.pxp,.pxv,.phc,.pxsec){border-radius:12px}
#toolsCard :is(.phh>b,.sccard>b,.netcfg-t,.phexp>b,summary>b){display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:700;color:var(--text);letter-spacing:0}
#toolsCard :is(.phh>b,.phexp>b,summary>b,.snadd summary,.netcfg-t) svg.i{width:18px;height:18px;color:var(--accent);flex:none}
#toolsCard .snadd summary{display:inline-flex;align-items:center;gap:8px}
#toolsCard summary{cursor:pointer;list-style:none}#toolsCard summary::-webkit-details-marker{display:none}
#toolsCard :is(.cpex button,.snifs button,.dnhist button,.pxm button,.pxdays button,.snports a,.snports i){display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:4px 12px;border-radius:999px;font:600 12.5px/1.2 var(--f-body)}
#toolsCard :is(.phgrid,.sccard,.cplbl,.pvedit,#tRes,.pxr) label{font-size:12px;font-weight:700;color:var(--muted)}
#toolsCard :is(.phgrid,.sccard,.pvedit,.pxr,.pxe,#tRes,.gufields) .field:not(textarea){height:40px;min-height:40px}
#toolsCard .tbar .btn{height:40px}#toolsCard .tbar .field{height:40px}
#toolsCard :is(.pvbt,.smhead,.pepw,.pgout) .btn{height:38px}
#toolsCard :is(#drHAdd,#snAdd) .btn{height:40px}   /* uz polja od 40 px */   /* dugme sa ikonicom i dugme sa tekstom u istom redu: ista visina */
#toolsCard :is(.pvbt,.smhead,.pxrb,.pepw,.pgout) .btn:not(label):has(> svg.i:only-child){width:38px;height:38px;padding:0;justify-content:center}
.btn:not(label):has(> svg.i:only-child){padding:0;aspect-ratio:1/1}   /* samo ikonica: kvadrat iste visine kao ostala dugmad */
#toolsCard .pxrb .btn{height:36px;padding:0 12px;font-size:13px}#toolsCard .pxrb .btn:has(> svg.i:only-child){width:36px;padding:0}
#toolsCard .sni .pvbt .btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
#toolsCard .pvico svg.i{width:44px;height:44px;color:var(--accent);stroke-width:1.6}
#toolsCard :is(.phnote,.tpanel>p.muted,.snadd p.muted){font-size:12.5px;line-height:1.5}
.btn.gel svg.i{color:var(--accent-ink)}   /* ikonica na glavnom dugmetu: boja teksta, ne akcenta (inače se ne vidi) */
#toolsCard .pxtabs button,#toolsCard .segc button{display:inline-flex;align-items:center;justify-content:center;gap:6px}#toolsCard .segc svg.i{width:16px;height:16px}
/* ===== Izgled po uzoru na Swegon IQlogic ===== */
/* pločice kategorija: Smart Home i Alati isto — bela pločica, okrugla ikonica u boji, naziv ispod */
.shgrid,#toolTabs .tooltabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.shgrid .shtile,#toolTabs .tooltabs button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;text-align:center;min-height:128px;padding:16px 8px 12px;
  border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(16,24,36,.07);color:var(--text)}
.shgrid .shtile:hover,#toolTabs .tooltabs button:hover{border-color:var(--c,var(--accent));box-shadow:0 4px 14px rgba(16,24,36,.10)}
.shgrid .fic,#toolTabs .tooltabs .ti{width:56px;height:56px;margin:0;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--c,var(--accent));
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 5px rgba(0,0,0,.18)}
.shgrid .fic svg.i,#toolTabs .tooltabs .ti svg.i{width:28px;height:28px;color:#fff;stroke-width:2.1}
.shgrid .shtile b,#toolTabs .tooltabs button b{font-size:13.5px;font-weight:700;line-height:1.2}
.shgrid .shtile small,#toolTabs .tooltabs button small{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted);line-height:1.3}
.shgrid .shtile.act{border-color:var(--ok);background:var(--surface);animation:none}
.shgrid .shtile.act .fic{box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 0 0 4px color-mix(in srgb,var(--ok) 35%,transparent)}
.shgrid .shtile.warn{border-color:var(--warn);background:var(--surface)}
.shgrid .shtile .shdot{top:10px;right:10px}
#toolTabs .ttgrp h3{color:var(--muted)}
/* podnožje */
main.wrap{min-height:calc(100dvh - 200px)}   /* podnožje na dnu i kad je strana kratka */
/* meni (IQlogic): bez zelene nijanse — neutralno sivo, izabrano = svetliji red + tanka traka levo */
.side .tsec,.side .titems a{position:relative;transition:background .15s,color .15s}
.side .tsec:hover,.side .titems a:hover{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text)}
.side .tgrp.on>.tsec{background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text)}
.side .tgrp.on>.tsec svg.i{color:var(--text)}
.side .tgrp.on>.tsec::before,.side .titems a.cur::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side .titems a.cur{color:var(--text);font-weight:800;background:color-mix(in srgb,var(--text) 8%,transparent)}
.side .titems{border-left-color:color-mix(in srgb,var(--text) 14%,transparent)}
.foot{position:relative;z-index:46;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;min-height:54px;margin:18px -16px -40px;padding:0 18px env(safe-area-inset-bottom,0px);
  background:#0c0e10;border-top:1px solid #2b3036;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:#9aa4b1;font:600 12px/1 var(--f-body)}
.foot .flogo{display:flex;align-items:center;gap:9px;color:#f4f6f8;font:800 15px/1 var(--f-display);letter-spacing:-.01em}
.foot .mark{width:20px;height:20px;border-radius:6px;box-shadow:none}
.foot .fmid{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid #2b3036;border-radius:999px;background:#15181b;color:#d5dae0;
  font:800 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.foot .fmid::before{content:"";width:7px;height:7px;border-radius:50%;flex:none;background:#7ac143;box-shadow:0 0 0 2px rgba(122,193,67,.18),0 0 8px rgba(122,193,67,.7)}
.foot .ftime{justify-self:end;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.foot .ftime b{color:#f4f6f8;font:700 15px/1 var(--f-body);letter-spacing:.02em}.foot .ftime span{color:#7d8894;font-size:11.5px}
@media (max-width:420px){.foot .ftime span{display:none}.foot .flogo{font-size:14px}}
/* svetla tema: crno zaglavlje, bočni meni i podnožje (okvir panela), svetlo siva sredina */
.lt header.top,.lt .side,.lt .foot{--bg:#101214;--surface:#1a1d21;--surface-2:#23272c;--surface-3:#2b3036;--line:#30363d;--text:#f1f3f5;--muted:#9aa4b1;--faint:#6b7480;color:var(--text)}
.lt header.top{background:#101214!important;backdrop-filter:none;-webkit-backdrop-filter:none;margin-bottom:16px}
.lt header.top::after{display:none}
.lt .side{border-right-color:#000}
.lt body{background:var(--bg)}
.lt .card{box-shadow:0 1px 3px rgba(16,24,36,.08)}
/* ===== IQlogic: podstrane — ikonica stavke je krug u boji (bela ikonica), isključeno = sivo ===== */
.dr .dri,.dv .dvi,.aqo .aqi,.dl .dlt{width:44px!important;height:44px!important;border-radius:50%!important;display:grid;place-items:center;background:var(--c,#4b5d73)!important;color:#fff!important;
  filter:none!important;opacity:1!important;font-size:0;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.16)!important}
:is(.dri,.dvi,.aqi,.dlt) svg.i{width:22px;height:22px;color:#fff;stroke-width:2.1}
:is(.dri,.dvi,.aqi) .em{display:grid;place-items:center;filter:none!important;opacity:1!important}
#applGrid .dr:not(.on) .dri,.dv:not(.on) .dvi,.aqo:not(.on) .aqi,.dl:not(.on) .dlt,.dr.off .dri{background:#a3acb8!important}
.dl .dlt{--c:#f2a900}.dl.on .dlt{box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 0 16px rgba(242,169,0,.55)!important}
:is(#applGrid .dr.on,.dv.on,.aqo.on) :is(.dri,.dvi,.aqi){box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)!important}
.dr.ring .dri{background:var(--warn)!important}.dr.open .dri{background:#f07c1a!important}
/* stavke na podstranama: bele kartice kao pločice */
.dr,.dv,.aqo,.dl,.wz,.relay{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,36,.06)}
:is(#applGrid .dr.on,.dv.on,.aqo.on,.dl.on){background:var(--surface);border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.ptop span{display:inline-flex;align-items:center;gap:6px}.ptop span svg.i{width:16px;height:16px}
.wrun b{display:inline-flex;align-items:center;gap:6px}.wrun b svg.i{width:18px;height:18px}
/* ===== IQlogic zaglavlje: okrugla ikonica u boji strane, naslov + red ispod ===== */
.ptitle .pic{border-radius:50%!important;background:var(--c,var(--accent))!important;color:#fff!important;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.ptitle .pic svg.i{color:#fff;width:20px;height:20px;stroke-width:2.2}
.ptitle .ptx{display:flex;flex-direction:column;min-width:0;line-height:1.1}
.ptitle #ptSub{font:600 11px/1.3 var(--f-body);color:var(--muted);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.lt header.top .ptitle #ptSub{color:#9aa4b1}
/* ===== IQlogic: ostale okrugle ikonice (alarm, skeniranje, lozinke) i dnevnik kao tabela ===== */
.altile .ati,.sni .ico,.pvi .pvav{border-radius:50%!important;color:#fff!important;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.15)}
.altile .ati{background:#2fa84f!important}.altile .ati svg.i{color:#fff}
.altile[data-s="armed"] .ati{background:#d64545!important}.altile[data-s="alarm"] .ati{background:#ff0033!important}
.altile[data-s="err"] .ati{background:#f07c1a!important}.altile[data-s="idle"] .ati{background:#a3acb8!important}
.sni .ico{background:var(--c)!important;font-size:20px}.sni.off .ico{filter:grayscale(.8);opacity:.7}
.alev{gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ale{grid-template-columns:22px minmax(0,1fr) auto;border-radius:0;padding:9px 12px;border-bottom:1px solid var(--line)}
.ale:last-child{border-bottom:0}.ale:nth-child(odd){background:var(--surface-2)}
.ale i{width:18px;height:18px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14)}
.src .ic{border-radius:50%;background:var(--c);color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.15)}
.src .ic svg.i{color:#fff}.src:not([aria-pressed="true"]) .ic{filter:saturate(.85)}
/* IQlogic dorada: Meteorologija, CCTV, Navodnjavanje, pumpe */
#weatherCard .mt .mi.mb{width:44px!important;height:44px!important;border-radius:50%;display:grid;place-items:center;background:var(--c);box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.15);font-size:0;margin-bottom:4px}
.mt .mi.mb svg.i{width:22px;height:22px;color:#fff;stroke-width:2.1}
.camtile{background:var(--surface);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,36,.06)}
.cti{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#4b5d73;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.15);margin-bottom:4px}
.cti svg.i{width:22px!important;height:22px!important;color:#fff!important}.cti i{right:-2px;top:-2px;width:12px;height:12px;border:2px solid var(--surface)}
.wsum b svg.i{width:18px;height:18px;color:#27a9d9;vertical-align:-3px}
/* unutrašnje kartice: bele sa tankom ivicom (kao pločice), u svim podstranama i alatima */
.mt,.wsum div,.pchart,.aqvals>*,.camtile,.altile,
#toolsCard :is(.phcard,.sccard,.pvgen,.pvedit,.pvlock,.snadd,.dnsum,.ntsum,.smst,.phs,.nti,.sni,.smc,.pvi,.rsprev,.dntab,.smmsgs){background:var(--surface);box-shadow:0 1px 2px rgba(16,24,36,.06)}
#toolsCard :is(.pxr,.pxp,.pxv,.phc,.pxsec,.dnrow){background:var(--surface-2)}
#powerCard .wsum div:first-child{background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.on[data-anim=pump] .em{animation:pumppulse 1.2s ease-in-out infinite}
@keyframes pumppulse{50%{transform:scale(1.14)}}
/* ===== meni: ikonice u krugu, grupe u Alatima, bez linije ===== */
.side .tsec>svg.i{width:30px;height:30px;padding:6px;box-sizing:border-box;border-radius:50%;background:var(--c,#4b5d73);color:#fff!important;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
.side .tsec{gap:12px;padding:8px 10px;font-size:14.5px}
.side .titems{border-left:0;margin:4px 0 8px 8px;padding-left:0;gap:2px}
.side .titems a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;font-size:13.5px}
.side .tic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.16)}
.side .tic svg.i{width:13px;height:13px;color:#fff;stroke-width:2.4}
.side .tgl{display:block;padding:10px 10px 3px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.side .titems a.cur::before,.side .tgrp.on>.tsec::before{top:6px;bottom:6px}
.side-logo{padding:4px 8px 14px;border-bottom:1px solid color-mix(in srgb,var(--text) 10%,transparent);margin-bottom:4px}
.side-logo .mark{box-shadow:none}
/* ===== podnožje zakucano za dno ekrana ===== */
:root{--fh:28px}
.foot .flogo{font-size:12px!important;gap:7px!important}.foot .mark{width:14px!important;height:14px!important;border-radius:4px!important}
.foot .flogo img{display:block;width:auto;filter:invert(1) brightness(1.15)}   /* crni logo -> beo na tamnom podnožju */
.foot .fmark{height:17px}.foot .fword{height:11px}
.foot .ftime b{font-size:12px!important}.foot .ftime span{font-size:10.5px!important}
.foot{position:fixed!important;left:0;right:0;bottom:0;margin:0!important;z-index:46;grid-template-columns:auto 1fr!important;min-height:0!important;
  height:calc(var(--fh) + env(safe-area-inset-bottom,0px));padding:0 18px env(safe-area-inset-bottom,0px)!important}
body{padding-bottom:calc(var(--fh) + 28px + env(safe-area-inset-bottom,0px))}
html.admin body{padding-bottom:calc(var(--fh) + 104px + env(safe-area-inset-bottom,0px))}   /* admin traka ne prekriva poslednje dugme */
main.wrap{min-height:0}
.side{bottom:calc(var(--fh) + env(safe-area-inset-bottom,0px))!important}
@media (min-width:1000px){.side{bottom:calc(var(--fh) + 16px + env(safe-area-inset-bottom,0px))!important}}
.toast{bottom:calc(14px + var(--fh) + env(safe-area-inset-bottom,0px))}
html.admin .toast{bottom:calc(90px + var(--fh) + env(safe-area-inset-bottom,0px))}
.admbar{bottom:calc(10px + var(--fh) + env(safe-area-inset-bottom,0px))!important}
.rfab{bottom:calc(14px + var(--fh) + env(safe-area-inset-bottom,0px))}
.mbar{bottom:calc(8px + var(--fh) + env(safe-area-inset-bottom,0px))}
.pwag-arrow{bottom:calc(10px + var(--fh) + env(safe-area-inset-bottom,0px))}
/* ===== Admin i spiskovi: okrugle ikonice u boji (kao svuda), bez „semafor“ tačkica, polja istim fontom ===== */
.btd .ic{width:38px!important;height:38px!important;border-radius:50%!important;background:var(--c,#4b5d73)!important;color:#fff!important;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 4px rgba(0,0,0,.15)}
.btd .ic svg.i{color:#fff;width:19px;height:19px}
.btd .ic:has(use[href="#i-bulb"]){--c:#f2a900}.btd .ic:has(use[href="#i-plug"]){--c:#0f9d8f}.btd .ic:has(use[href="#i-cam"]),.btd .ic:has(use[href="#i-door"]){--c:#4b5d73}
.btd .ic:has(use[href="#i-bell"]){--c:#f07c1a}.btd .ic:has(use[href="#i-usb"]){--c:#7c5cd6}.btd .ic:has(use[href="#i-game"]){--c:#e0343c}
.btd .ic:has(use[href="#i-headph"]){--c:#1d8fe0}.btd .ic:has(use[href="#i-signal"]){--c:#27a9d9}
.card-head .lights{display:none!important}
input.field,select.field,textarea.field{font-family:var(--f-body)!important}
/* ===== računar, svetla tema: ravan panel (IQlogic) — meni crni stub uz levu ivicu, zaglavlje jedna crna traka ===== */
@media (min-width:1000px){
  .lt .side{background:#101214!important;left:0!important;top:0!important;bottom:calc(var(--fh) + env(safe-area-inset-bottom,0px))!important;border:0!important;border-right:1px solid #000!important;border-radius:0!important;box-shadow:none!important}
  .lt .wrap,.lt .top-in{margin-left:calc(var(--sw) + max(16px,(100% - var(--sw) - 600px) / 2))!important}
  .lt header.top{padding-top:0!important;padding-bottom:0!important}
  .lt header.top .top-in{background:transparent!important;border:0!important;border-radius:0!important;padding:14px 0 12px!important}
  .lt body .admbar,.lt body .toast{left:calc(var(--sw) + (100% - var(--sw)) / 2)!important}
}
/* oznake odeljaka unutar strana (Vrata, Upravljanje, DNS…): kao grupe u Alatima */
.netcfg-t{display:flex;align-items:center;gap:8px;font-size:10.5px!important;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.netcfg-t small,.netcfg-t .demotag{text-transform:none;letter-spacing:0}.netcfg-t .demotag{text-transform:uppercase;letter-spacing:.06em}
#toolsCard .pvgen .netcfg-t{font-size:14.5px!important;letter-spacing:0;text-transform:none;color:var(--text)}
/* kvačice, radio i klizači u boji akcenta (ne plave podrazumevane) */
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--accent)}
/* Lozinke: katanac kao okrugla ikonica (kao pločica) */
#toolsCard .pvico{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#d64545;box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),0 2px 5px rgba(0,0,0,.18)}
#toolsCard .pvico svg.i{width:30px!important;height:30px!important;color:#fff!important;stroke-width:2.1}
/* meni: podstavke jednobojne (lakše se nalazi), izabrana u boji akcenta; glavne grupe ostaju u boji */
.side .tic{background:color-mix(in srgb,var(--text) 12%,transparent)!important;box-shadow:none!important}
.side .tic svg.i{color:var(--muted)!important}
.side .titems a:hover .tic svg.i{color:var(--text)!important}
.side .titems a.cur .tic{background:var(--c)!important;box-shadow:inset 0 0 0 2px rgba(0,0,0,.16)!important}   /* izabrano: prava boja iz pregleda (pločice) */.side .titems a.cur .tic svg.i{color:#fff!important}
/* ===== telefon (iPhone 13 mini i uži): više mesta za sadržaj, kompaktno zaglavlje, stabilno podnožje ===== */
.foot{-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
body.kb .foot{display:none}   /* tastatura otvorena: iOS bi „podigao“ podnožje na sredinu ekrana */
body.kb{padding-bottom:28px}
@media (max-width:430px){
  body{padding-inline:10px}
  header.top{margin-inline:-10px;padding:10px 10px 8px}
  .foot{padding-inline:12px!important}
  .card{padding:14px;border-radius:16px;gap:12px}
  .ptitle{font-size:16px!important}.ptitle .pic{width:30px!important;height:30px!important}.ptitle .pic svg.i{width:17px;height:17px}
  .ptitle #ptSub{font-size:10.5px}
  .top-in .sbar{height:34px!important}
  .shgrid,#toolTabs .tooltabs{gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .shgrid .shtile,#toolTabs .tooltabs button{min-height:118px;padding:14px 6px 10px}
  .shgrid .fic,#toolTabs .tooltabs .ti{width:50px;height:50px}
  .card-head h2{font-size:16px}
  .dr,.dv,.aqo,.dl{padding:10px}
}
/* ===== doterivanje podstrana ===== */
/* naslov podstrane: uvek iste boje i težine (Alarm, CCTV, primeri, alati) */
.card-head h2{color:var(--text);font-weight:800;font-size:17px}
/* Navodnjavanje: bele kartice, boja samo kao traka levo; stanje zone kao tekst (ne okvir), naslov se ne lomi */
#waterCard .acc-row,#waterCard .wrun{background:var(--surface)!important;border:1px solid var(--line)!important;box-shadow:inset 4px 0 0 var(--bar,#2fa84f),0 1px 2px rgba(16,24,36,.06);animation:none!important}
#waterCard .wrun{--bar:#27a9d9}
#waterCard .wz{grid-template-columns:minmax(0,1fr);gap:6px}
#waterCard .wz .wn{justify-self:start;padding:0;border:0;background:none;font-size:12px;font-weight:700;color:var(--muted)}
#waterCard .wz.run{background:var(--surface)!important;border-color:#27a9d9!important;box-shadow:inset 4px 0 0 #27a9d9;animation:none!important}
#waterCard .wz.run .wn{color:#1d8fe0}
/* Akvarijum: stanje jednom (tekst), uključeno zeleno */
.aqbadge{display:none!important}
.aqo.on .aqst small{color:var(--ok);font-weight:800}
/* SMS / modem stanje: ikonica u redu sa tekstom */
.smst svg.i{width:16px;height:16px;vertical-align:-3px;color:var(--accent);margin-right:2px}.smst.bad svg.i{color:var(--crit)}
/* krugovi zvonjenja: jedan red (krug · zvona · dugmad), lokali ispod */
#toolsCard .pxr{grid-template-columns:minmax(0,1fr) 92px auto!important}
#toolsCard .pxr .pxm{grid-column:1/-1;grid-row:2}
#toolsCard .pxr label{flex-direction:row!important;align-items:center;gap:6px}
@media (max-width:560px){#toolsCard .pxe small{display:none}}   /* lokal: broj i tačka dovoljni, bez reda ispod polja */
/* ===== računar: pločice i ikonice rastu sa prozorom, reaguju na miš ===== */
@media (min-width:1000px){
  .shgrid,#toolTabs .tooltabs{grid-template-columns:repeat(auto-fill,minmax(clamp(140px,11vw,210px),1fr));gap:clamp(10px,.9vw,16px)}
  .shgrid .shtile,#toolTabs .tooltabs button{min-height:clamp(128px,10.5vw,190px);gap:clamp(8px,.7vw,12px)}
  .shgrid .fic,#toolTabs .tooltabs .ti{width:clamp(56px,4.6vw,84px);height:clamp(56px,4.6vw,84px)}
  .shgrid .fic svg.i,#toolTabs .tooltabs .ti svg.i{width:clamp(28px,2.3vw,42px);height:clamp(28px,2.3vw,42px)}
  .shgrid .shtile b,#toolTabs .tooltabs button b{font-size:clamp(13.5px,1vw,16px)}
}
/* pokreti: jedna „meka“ kriva za sve (brzo krene, lagano stane) */
:root{--ease-out:cubic-bezier(.22,1,.36,1);--ease-spring:cubic-bezier(.34,1.42,.5,1)}
.shgrid .shtile,#toolTabs .tooltabs button{position:relative;isolation:isolate;overflow:hidden;
  transition:transform .5s var(--ease-out),box-shadow .5s var(--ease-out),border-color .35s ease,background-color .35s ease}
.shgrid .shtile::before,#toolTabs .tooltabs button::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c,var(--accent)) 14%,transparent),transparent 70%);transition:opacity .5s var(--ease-out)}
.shgrid .fic,#toolTabs .tooltabs .ti{transition:transform .6s var(--ease-spring),box-shadow .5s var(--ease-out)}
.shgrid .fic svg.i,#toolTabs .tooltabs .ti svg.i{transition:transform .6s var(--ease-spring)}
@media (hover:hover){
  .shgrid .shtile:hover,#toolTabs .tooltabs button:hover{transform:translateY(-4px);
    box-shadow:0 1px 2px rgba(16,24,36,.06),0 10px 24px -6px color-mix(in srgb,var(--c,var(--accent)) 30%,rgba(16,24,36,.14)),0 22px 44px -18px rgba(16,24,36,.22)}
  .shgrid .shtile:hover::before,#toolTabs .tooltabs button:hover::before{opacity:1}
  .shgrid .shtile:hover .fic,#toolTabs .tooltabs button:hover .ti{transform:scale(1.08);box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 0 0 6px color-mix(in srgb,var(--c,var(--accent)) 16%,transparent),0 8px 18px -4px color-mix(in srgb,var(--c,var(--accent)) 55%,transparent)}
  .shgrid .shtile:hover .fic svg.i,#toolTabs .tooltabs button:hover .ti svg.i{transform:scale(1.06) rotate(-4deg)}
}
.shgrid .shtile:active,#toolTabs .tooltabs button:active{transform:translateY(-1px) scale(.975);transition-duration:.15s}
/* ulazak na stranu: kartice i pločice se pojave redom (blago, bez skakanja) */
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.wrap.vin>section:not([hidden]),main.wrap.vin>.grid{animation:vin .55s var(--ease-out) both}
.side a,.side button{-webkit-tap-highlight-color:transparent}
.side a:focus:not(:focus-visible),.side button:focus:not(:focus-visible){outline:none}
main.wrap.vin .shgrid>.shtile,main.wrap.vin #toolTabs .tooltabs>button,main.wrap.vin #applGrid>*,main.wrap.vin .dgrid>*{animation:vin .6s var(--ease-out) both;animation-delay:calc(var(--n,0) * 35ms + 60ms)}
/* meni: pozadina stavke klizi mekano */
.side .titems a,.side .tsec{transition:background-color .35s var(--ease-out),color .25s ease}
.side .titems a .tic{transition:background-color .35s var(--ease-out),transform .5s var(--ease-spring)}
@media (hover:hover){.side .titems a:hover .tic{transform:scale(1.08)}}
/* iPhone aplikacija sa početnog ekrana: zaglavlje ispod statusne trake / notch-a (uže pravilo iznad ga je poništavalo) */
@media (display-mode:standalone) and (max-width:999px){
  html header.top,html.lt header.top{padding-top:calc(10px + env(safe-area-inset-top,0px))!important}
  html .side,html.lt .side{padding-top:calc(16px + env(safe-area-inset-top,0px))!important}
}
/* ===== računar: zaglavlje u jednom redu (naslov levo, stanje sistema desno); pregledi u 3 kolone ===== */
@media (min-width:1000px){
  .top-in{flex-wrap:nowrap!important}
  .lt header.top .top-in{padding:8px 0!important}
  .lt header.top{margin-bottom:12px}
  .top-in .chips{order:0!important;width:auto!important;margin-left:auto!important;flex:0 1 auto;padding-bottom:0}
  body[data-view="media"] .top-in .chips{margin-left:0!important}
  .top-in{gap:10px!important}.top-in .rtop .al{display:none}   /* Daljinski: samo ikonica, da sve stane u red */
  .top-in .sbar{flex:0 1 auto!important;height:34px!important}
  .ptitle{font-size:18px!important}.ptitle .pic{width:32px!important;height:32px!important}
  .shgrid,#toolTabs .tooltabs{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  /* levi meni: logo iste visine kao zaglavlje (linija u ravni), Multimedija odvojena tankim linijama bez velikih razmaka */
  .lt .side{padding-top:0!important;gap:8px}
  /* logo Teco.Pi u zaglavlju (crna traka preko cele širine), iznad menija i poravnat sa njim; meni počinje ispod zaglavlja */
  .lt .side-logo{display:none!important}
  .lt header.top{z-index:46}
  .lt header.top .top-in{height:56px;box-sizing:border-box;align-items:center}
  .lt .side{top:56px!important;padding-top:10px!important}
  .lt header.top .logo{display:flex!important;position:absolute;left:0;top:0;width:var(--sw);height:56px;box-sizing:border-box;padding:0 20px;align-items:center;gap:11px;
    font:800 21px/1 var(--f-display);letter-spacing:-.015em;color:#fff;background:#101214;transition:width .2s ease}
  .lt header.top .logo .mark{width:30px;height:30px;flex:none;border-radius:9px}
  body.side-mini .lt header.top .logo,.lt body.side-mini header.top .logo{font-size:0;gap:0;justify-content:center;padding:0}
  .lt .tsep{margin:0 8px}
}
/* ===== telefon: tanje podnožje — sadržaj delom ulazi u prostor iPhone trake za povratak ===== */
@media (max-width:999px){
  /* otvoren levi meni ide do dna ekrana (preko levog dela podnožja) — jedan panel, bez procepa i linije */
  .side{bottom:0!important;z-index:47;padding-bottom:calc(16px + var(--fh) + env(safe-area-inset-bottom,0px))!important}
  :root{--fh:22px}
  .foot{height:calc(var(--fh) + env(safe-area-inset-bottom,0px) * .45)!important;padding-bottom:calc(env(safe-area-inset-bottom,0px) * .45)!important}
}
/* telefon: share-ovi i korisnici — dugmad u svom redu ispod imena (ime i veličina dobijaju celu širinu) */
@media (max-width:600px){#smbList .btd,#smbUsers .btd{grid-template-columns:36px minmax(0,1fr)}#smbList .btd .bb,#smbUsers .btd .bb{grid-column:1/-1;justify-content:flex-start}#smbList .btd .t b{overflow-wrap:anywhere}}
.btd .t .smbtag{font-style:normal;display:inline-block;padding:0 6px;border-radius:6px;background:#e0343c;color:#fff;font:800 10px/16px var(--f-body);letter-spacing:.04em;vertical-align:1px}
/* akvarijum: birač boje RGB svetla (krug u boji, klik otvara izbor) */
.aqrgb{position:relative;display:inline-block;width:20px;height:20px;cursor:pointer;margin-left:8px;vertical-align:-4px;padding:0;border:0;background:none}
.rgbpop{position:fixed;z-index:80;width:250px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px}
.rgbpop[hidden]{display:none}
.rgbsw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.rgbsw button{aspect-ratio:1;border-radius:50%;border:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);cursor:pointer;transition:transform .15s}.rgbsw button:hover{transform:scale(1.12)}
.rgbpop label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:700;color:var(--muted)}
.rgbpop input[type=range]{-webkit-appearance:none;appearance:none;height:12px;border-radius:999px;margin:0}
.rgbpop input[type=range]{background:transparent}
.rgbpop input.rgbh::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.rgbpop input.rgbh::-moz-range-track{height:12px;border-radius:999px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.rgbpop input.rgbv::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:linear-gradient(90deg,#000,var(--c,#fff))}
.rgbpop input.rgbv::-moz-range-track{height:12px;border-radius:999px;background:linear-gradient(90deg,#000,var(--c,#fff))}
