#!/usr/sbin/nft -f
# Teco.Pi firewall: ulaz samo za ono što Pi nudi kućnoj mreži; VPN (tun0) samo SSH i web; izlaz slobodan.
# Instalacija: sudo cp nftables.conf /etc/nftables.conf && sudo systemctl enable --now nftables

flush ruleset

table inet filter {
	set lan_tcp {
		type inet_service; flags interval
		elements = {
			22,           # SSH
			80,           # Teco.Pi web (stranica, API, WebSocket)
			139, 445,     # Samba (deljeni folderi, WDS)
			53,           # DNS resolver (dnsmasq)
			8099,         # cast (YouTube / Chrome -> Teco.Pi)
			631,          # IPP štampa (CUPS)
		}
	}
	set lan_udp {
		type inet_service; flags interval
		elements = {
			53,                # DNS resolver
			123,               # NTP server (chrony, Ekstenzije → NTP vreme)
			67, 69, 4011,      # WDS: proxy-DHCP, TFTP, PXE
			137, 138,          # NetBIOS (\\TECOPI)
			1900,              # SSDP (cast otkrivanje)
			5353,              # mDNS (tecopi.local)
			5060,              # SIP (Asterisk)
			10000-10200,       # RTP (Asterisk rtp.conf)
		}
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto { icmp, ipv6-icmp } accept
		udp sport 67 udp dport 68 accept   # DHCP odgovori (NetworkManager)

		tcp dport 22 ct state new meter ssh_rate { ip saddr limit rate over 6/minute burst 6 packets } drop   # pogađanje lozinke
		iifname { "wlan0", "eth0" } tcp dport @lan_tcp accept
		iifname { "wlan0", "eth0" } udp dport @lan_udp accept

		iifname "tun0" tcp dport { 22, 80, 631 } accept
		iifname "tun0" udp dport 123 accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
